# dsh-washer bundle patch
#
# 一行 insert 把插件挂进 Web 客户端。`disabled` 表达式防止同一插件被
# 两个不同 id 重复挂载（宿主会在启动时把两份都实例化，导致重复注册 slot）。
#
# config 是默认值的唯一来源。用户在设置页的改动不写回这里，而是存到
# localStorage（key: dsh-washer:prefs），原因见 src/client.template.js
# 「偏好持久化」一节：configForms 那套 store 只服务挂在 loader `include`
# 行下的插件，走 `insert` 的第三方 bundle 拿到的控制器永远是 unavailable。
- insert:
    - id: washer
      name: '@lyx0717/dsh-washer'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === '@lyx0717/dsh-washer' && e.options.id !== 'washer' && !e.disabled)"
      config:
        enabled: true
        # dock    = 挂在输入框上方的停靠条
        # overlay = 挂在 shell.overlay 的网页内浮层（和桌面悬浮窗是两回事）
        mode: dock
        # 仅 overlay 形态有效：只在忙碌时出现。waiting 时无视此开关，一定出现。
        overlayOnlyWhenBusy: true
        # pixel（默认，像素 sprite）/ precision（精密家电）
        skin: precision
        hideWhenIdle: false
        doneHoldMs: 6000
        # 桌面悬浮窗的本地 HTTP+WS 服务（只绑 127.0.0.1，随机 token）。
        desktopOverlay: true
        # 0 = 让系统分配端口，避免抢端口；日志里会打印实际地址
        desktopOverlayPort: 0
        # 悬浮窗跟着宿主一起启停：关掉的话端口还开着，但不会自动拉窗。
        desktopOverlayAutoLaunch: true
        # 启动档位：normal / tiny（tiny 只留指示灯）
        desktopOverlaySize: normal
        # 正常档的缩放：compact(0.8) / standard(1.0) / large(1.2)；极简档不受影响
        desktopOverlayScale: standard
        # 鼠标穿透。开着时点击落到下面的应用，⌥⌘W 恢复。
        desktopOverlayClickThrough: false
        # 洗完弹系统通知：只报「完成」「故障」「等你确认」「卡住」
        desktopOverlayNotify: false
        # 状态音效：完成 / 故障 / 等你确认各响一声，中间运转不吵
        desktopOverlaySound: false
        # 勿扰：开会/专注时全静音——浮窗照常显示，但不弹通知、不出声
        desktopOverlayDnd: false

name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 零第三方依赖：不需要 npm install。build 生成 client.js / float.machines.js，
      # 随后 npm test 里的 freshness 用构建产物做比对。
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
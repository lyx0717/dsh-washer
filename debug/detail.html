<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- connect-src 必须同时放行 http://，否则 WS 空闲时用 HTTP 拉一次快照的兜底会被 CSP 直接拒掉 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*;">
<title>洗衣机详情</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #16181e;
    --line: #262a33;
    --text: #e8eaee;
    --dim: #8b929e;
    --faint: #6b7280;
    --ok: #2ee06a;
    --warn: #f5b93a;
    --bad: #e5484d;
    --run: #3aa0ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  /* 顶部拖拽条：整个标题栏都能拖，这是信息窗唯一的移动方式 */
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;
  }
  .bar .title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  /*
   * 状态灯。
   *
   * 早先只写了 running/done/error/waiting 四个值，而宿主报下来的是
   * 状态机的十态（off/waiting/error/rinsing/washing/starting/spinning/
   * draining/done/idle）——只有 waiting/error/done 三个能对上，
   * 剩下七个（占全部运行时间）全都落到默认灰。用户看到的
   * "左上角灰色点"就是这个：不是没上色，是选择器根本没覆盖到。
   *
   * 运行中的五个（rinsing/washing/starting/spinning/draining）共用
   * 同一个 --run 蓝：它们在语义上是同一类「正在干活」，颜色分得再细
   * 也没人分得清，状态文字已经写在旁边了。
   */
  .bar .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    transition: background-color 180ms ease, box-shadow 180ms ease;
  }
  .bar .dot[data-s="off"],
  .bar .dot[data-s="idle"] { background: var(--faint); }
  .bar .dot[data-s="starting"],
  .bar .dot[data-s="washing"],
  .bar .dot[data-s="rinsing"],
  .bar .dot[data-s="spinning"],
  .bar .dot[data-s="draining"] { background: var(--run); }
  .bar .dot[data-s="done"] { background: var(--ok); }
  .bar .dot[data-s="error"] { background: var(--bad); }
  .bar .dot[data-s="waiting"] { background: var(--warn); }
  /*
   * 运行中带一圈呼吸光晕，静态截图也能看出"它在动"。
   * 用 box-shadow 而不是改尺寸：尺寸变化会推动标题栏布局。
   */
  .bar .dot[data-s="starting"],
  .bar .dot[data-s="washing"],
  .bar .dot[data-s="rinsing"],
  .bar .dot[data-s="spinning"],
  .bar .dot[data-s="draining"] { box-shadow: 0 0 0 3px rgba(58, 160, 255, .22); }
  .bar .dot[data-s="waiting"] { box-shadow: 0 0 0 3px rgba(245, 185, 58, .22); }
  .bar .dot[data-s="error"] { box-shadow: 0 0 0 3px rgba(229, 72, 77, .22); }
  @media (prefers-reduced-motion: reduce) {
    .bar .dot { transition: none; }
  }
  .bar .turn { color: var(--faint); font-size: 11px; }
  .bar .x {
    -webkit-app-region: no-drag;
    cursor: pointer; color: var(--dim);
    width: 18px; height: 18px; display: grid; place-items: center;
    border-radius: 4px; font-size: 13px;
  }
  .bar .x:hover { background: rgba(255,255,255,.1); color: var(--text); }

  .body { padding: 10px 12px; overflow-y: auto; height: calc(100% - 37px); }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-thumb { background: #333a46; border-radius: 3px; }

  .sec { margin-bottom: 12px; }
  .sec h4 {
    margin: 0 0 5px; font-size: 10px; font-weight: 600;
    color: var(--faint); text-transform: uppercase; letter-spacing: .06em;
  }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .row .k { color: var(--dim); flex: none; }
  .row .v { font-variant-numeric: tabular-nums; text-align: right; min-width: 0; }
  /* 模型名可能很长，截断 + 悬停看全名 */
  .row .v.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /*
   * 模型名折两行：名字在上，provider 前缀在下。
   * 面板这行只装得下 17~18 个字符，而 group/deepseek-v4.1-flash 有 24 个，
   * 单行省略号会把关键的名字段整个切掉，只剩 group/deepseek-v4…。
   * 名字用正常字号，前缀降级成小灰字——前缀是路由信息，不是用户关心的东西。
   * 名字本身仍可能超长（自定义模型名），所以单独允许它自己省略。
   */
  .row .v.model { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .row .v.model .m-name {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .v.model .m-provider {
    font-size: 10px; color: var(--faint); letter-spacing: .02em;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 工具耗时横条：一眼看出谁慢，比看数字快 */
  .tool { padding: 2px 0; }
  .tool .top { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
  .tool .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .ms { color: var(--dim); flex: none; }
  .tool .ms[data-err="1"] { color: var(--bad); }
  .tool .track { height: 3px; background: var(--line); border-radius: 2px; margin-top: 2px; }
  .tool .fill { height: 100%; border-radius: 2px; background: var(--run); transition: width .25s; }
  .tool .fill[data-err="1"] { background: var(--bad); }

  /* 最近几轮：一眼回看刚跑完的几轮成败与耗时 */
  .hist { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .hist .h-l { color: var(--dim); }
  .hist .h-r { color: var(--dim); flex: none; }
  .hist .h-ok { color: var(--ok); }
  .hist .h-bad { color: var(--bad); }
  .hist .h-stop { color: var(--warn); }

  /* 会话：点一行把详情/浮窗切到那个会话（固定/跟随由宿主决定） */
  .sess { display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; -webkit-app-region: no-drag; }
  .sess:hover { background: var(--line); }
  .sess .s-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
  .sess .s-dot[data-run] { background: var(--run); }
  .sess .s-dot[data-urgent] { background: var(--warn); }
  .sess .s-label { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .s-tag { color: var(--faint); font-size: 10px; flex: none; }
  .sess[data-cur] .s-label { color: var(--ok); }
  .copy {
    -webkit-app-region: no-drag; cursor: pointer; margin-left: 6px;
    color: var(--dim); font-size: 10px; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px;
  }
  .copy:hover { color: var(--text); border-color: var(--dim); }

  .empty { color: var(--faint); font-size: 11px; padding: 2px 0; }
  .note { color: var(--faint); font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="title">
    <span class="dot" id="dot" data-s="off"></span>
    <span id="stateLabel">未连接</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="turn" id="turn"></span>
    <span class="x" id="close" title="关闭">✕</span>
  </div>
</div>

<div class="body">
  <div class="sec">
    <h4>运行</h4>
    <div class="row"><span class="k">模型</span><span class="v model" id="model" title=""></span></div>
    <div class="row"><span class="k">速度</span><span class="v" id="speed">—</span></div>
    <div class="row"><span class="k">本轮耗时</span><span class="v" id="elapsed">--:--</span></div>
    <div class="row" id="errRow" style="display:none"><span class="k">错误</span><span class="v"><span id="errCode" style="color:var(--bad)"></span><span class="copy" id="copyErr" title="复制错误码">复制</span></span></div>
  </div>

  <div class="sec">
    <h4>会话 <span id="sessHint" style="color:var(--faint);font-weight:400"></span></h4>
    <div id="sessions"><div class="empty">只有一个会话</div></div>
  </div>

  <div class="sec">
    <h4>Token</h4>
    <div class="row"><span class="k">输入</span><span class="v" id="tokIn">—</span></div>
    <div class="row"><span class="k">输出</span><span class="v" id="tokOut">—</span></div>
    <div class="row"><span class="k">缓存读取</span><span class="v" id="tokCache">—</span></div>
    <div class="row"><span class="k">缓存命中</span><span class="v" id="hitRate">—</span></div>
    <div class="note" id="tokNote">数字来自宿主 usage，累计值</div>
  </div>

  <div class="sec">
    <h4>工具耗时 <span id="toolHint" style="color:var(--faint);font-weight:400"></span></h4>
    <div id="tools"><div class="empty">本轮还没调用工具</div></div>
  </div>

  <div class="sec">
    <h4>最近几轮 <span id="histHint" style="color:var(--faint);font-weight:400"></span></h4>
    <div id="history"><div class="empty">还没有跑完的轮次</div></div>
  </div>
</div>

<script>
(function () {
  var LABEL = {
    off: '未连接', idle: '待机', starting: '启动中', washing: '洗涤中',
    rinsing: '漂洗中', spinning: '脱水中', waiting: '等你确认',
    draining: '排水换水', done: '洗完了', error: '故障',
  };
  var el = function (id) { return document.getElementById(id); };
  /*
   * 动作类别 → 中文。类别由宿主的 toolActionOf() 给出（command/edit…），
   * 文案留在这里，和 client.template.js 的 tool.* 词条是同一套意思。
   * 这个面板是独立 HTML，拿不到主词典，只能自带一份。
   */
  var TOOL_TEXT = {
    command: '跑命令', read: '读文件', write: '写文件', edit: '改文件',
    list: '列目录', find: '找文件', search: '搜代码',
    websearch: '搜网页', webfetch: '抓网页', browser: '开浏览器',
    subagent: '派子任务', plan: '列计划',
  };
  var host = window.washerHost || null;

  function fmtNum(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '—';
    return n.toLocaleString('en-US');
  }

  /*
   * 模型名按第一个斜杠折两行：group/deepseek-v4.1-flash
   *   → 名字 deepseek-v4.1-flash（正常字号）
   *   → 前缀 group（小灰字）
   * 只按第一个 / 拆，因为模型名自己也可能带斜杠（如 meta-llama/Llama-3-70B）。
   * 没有斜杠就只显示名字，不硬造一个空前缀行。
   */
  function setModel(name) {
    var node = el('model');
    if (!name) { node.textContent = '—'; node.removeAttribute('title'); return; }

    var cut = name.indexOf('/');
    var provider = cut > 0 ? name.slice(0, cut) : '';
    var model = cut > 0 ? name.slice(cut + 1) : name;

    node.textContent = '';
    var nameNode = document.createElement('span');
    nameNode.className = 'm-name';
    nameNode.textContent = model;
    node.appendChild(nameNode);

    if (provider !== '') {
      var providerNode = document.createElement('span');
      providerNode.className = 'm-provider';
      providerNode.textContent = provider;
      node.appendChild(providerNode);
    }
    node.title = name;
  }

  function renderTools(rank) {
    var box = el('tools');
    if (!Array.isArray(rank) || rank.length === 0) {
      box.innerHTML = '<div class="empty">本轮还没调用工具</div>';
      el('toolHint').textContent = '';
      return;
    }
    var max = 1;
    for (var i = 0; i < rank.length; i++) if (rank[i].ms > max) max = rank[i].ms;
    var html = '';
    for (var j = 0; j < rank.length; j++) {
      var t = rank[j];
      var pct = Math.max(2, Math.round((t.ms / max) * 100));
      var err = t.isError ? '1' : '0';
      /*
       * 名字用中文动作，技术名放 title 里。
       * 面板是"哪个工具在拖后腿"，但用户不认识 bash/apply_patch 这些技术名，
       * 所以主文案给动作，悬停才看技术名（对日志时用得上）。
       *
       * 宿主给的是动作类别（t.action = command/edit…），文案在这张 TOOL_TEXT 表里。
       * 认不出的类别退回 t.name：MCP 工具和自定义工具显示自己的名字。
       */
      var label = (typeof t.action === 'string' && TOOL_TEXT[t.action] !== undefined)
        ? TOOL_TEXT[t.action]
        : t.name;
      html += '<div class="tool">'
        + '<div class="top">'
        + '<span class="name" title="' + esc(t.name) + '">' + esc(label)
        + (t.calls > 1 ? ' <span style="color:var(--faint)">×' + t.calls + '</span>' : '')
        + '</span>'
        + '<span class="ms" data-err="' + err + '">' + fmtMs(t.ms) + '</span>'
        + '</div>'
        + '<div class="track"><div class="fill" data-err="' + err + '" style="width:' + pct + '%"></div></div>'
        + '</div>';
    }
    box.innerHTML = html;
    el('toolHint').textContent = '按最慢排序';
  }

  /*
   * 最近几轮成绩单：宿主 snapshot.history（新→旧，最多 10 条）。
   * 每条只给"第几轮 / 成败 / 用时 / 工具数"——回看刚跑完的几轮，不铺开完整日志。
   */
  function renderHistory(list) {
    var box = el('history');
    if (!Array.isArray(list) || list.length === 0) {
      box.innerHTML = '<div class="empty">还没有跑完的轮次</div>';
      el('histHint').textContent = '';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var h = list[i];
      var mark = h.aborted
        ? '<span class="h-stop">已停止</span>'
        : (h.ok
          ? '<span class="h-ok">✓</span>'
          : '<span class="h-bad">✕ ' + esc(h.errorCode || 'E-00') + '</span>');
      html += '<div class="hist">'
        + '<span class="h-l">第 ' + (h.turn || 0) + ' 轮</span>'
        + '<span class="h-r">' + mark + ' · ' + fmtMs(h.durationMs) + ' · ' + (h.toolCount || 0) + ' 工具</span>'
        + '</div>';
    }
    box.innerHTML = html;
    el('histHint').textContent = '新→旧';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtMs(ms) {
    if (typeof ms !== 'number' || !isFinite(ms)) return '—';
    if (ms < 1000) return Math.round(ms) + 'ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
    return Math.floor(ms / 60000) + 'm' + Math.round((ms % 60000) / 1000) + 's';
  }

  /* 会话（多会话时才有一行行可选）：点一行让宿主把视图切/固定到该会话 */
  var STATE_SHORT = { off: '离线', idle: '待机', starting: '启动', washing: '洗涤', rinsing: '漂洗', spinning: '脱水', waiting: '等你', draining: '排水', done: '完成', error: '故障' };
  function renderSessions(list, pinned, current) {
    var box = el('sessions');
    var rows = Array.isArray(list) ? list : [];
    if (rows.length <= 1) {
      box.innerHTML = '<div class="empty">只有一个会话</div>';
      el('sessHint').textContent = '';
      return;
    }
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var urgent = (r.state === 'waiting' || r.state === 'error');
      var running = r.running || r.state === 'washing' || r.state === 'rinsing' || r.state === 'spinning';
      var isCur = r.sessionId === current;
      var tag = (r.sessionId === pinned) ? '固定' : (isCur ? '当前' : '');
      html += '<div class="sess"' + (isCur ? ' data-cur' : '') + ' data-id="' + esc(r.sessionId) + '" title="' + esc(r.sessionId) + '">'
        + '<span class="s-dot"' + (urgent ? ' data-urgent' : (running ? ' data-run' : '')) + '></span>'
        + '<span class="s-label">' + esc(STATE_SHORT[r.state] || r.state) + ' · 第 ' + (r.turn || 0) + ' 轮</span>'
        + (tag ? '<span class="s-tag">' + tag + '</span>' : '')
        + '</div>';
    }
    box.innerHTML = html;
    el('sessHint').textContent = pinned ? '点一行固定' : '点一行切换';
    var items = box.querySelectorAll('.sess');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function () {
        var id = this.getAttribute('data-id');
        if (host && host.pinSession) host.pinSession(id);
      });
    }
  }

  function render(snap) {
    var s = snap.state || 'off';
    el('stateLabel').textContent = LABEL[s] || s;
    el('dot').dataset.s = s;
    el('turn').textContent = snap.turn > 0 ? '第 ' + snap.turn + ' 轮' : '';
    el('elapsed').textContent = snap.durationText || '--:--';

    setModel(snap.model);
    // 速度：Host 侧是 5 秒滑动窗口的均值，不是瞬时值
    el('speed').textContent = typeof snap.speed === 'number' && snap.speed >= 0
      ? snap.speed.toFixed(1) + ' tok/s'
      : '—';

    var u = snap.tokenUsage;
    if (u === null || u === undefined) {
      el('tokIn').textContent = '—';
      el('tokOut').textContent = '—';
      el('tokCache').textContent = '—';
      el('hitRate').textContent = '—';
    } else {
      el('tokIn').textContent = fmtNum(u.input);
      el('tokOut').textContent = fmtNum(u.output);
      el('tokCache').textContent = fmtNum(u.cacheRead);
      // 命中率 = 缓存读取 / (输入 + 缓存读取)。
      // 分母不含输出：缓存只作用于输入侧，算进去会把命中率稀释成错的数。
      var denom = (u.input || 0) + (u.cacheRead || 0);
      el('hitRate').textContent = denom > 0
        ? Math.round((u.cacheRead / denom) * 100) + '%'
        : '—';
    }
    renderTools(snap.toolRank);

    // 故障时给个「复制错误码」，方便贴给排查
    if (s === 'error') {
      lastSnap = snap;
      el('errRow').style.display = '';
      el('errCode').textContent = snap.errorCode || 'E-00';
    } else {
      el('errRow').style.display = 'none';
    }
    renderHistory(snap.history);
    renderSessions(snap.sessions, snap.pinnedSessionId, snap.sessionId);
  }

  var lastSnap = null;
  el('close').addEventListener('click', function () {
    if (host) host.closeDetail(); else window.close();
  });
  el('copyErr').addEventListener('click', function () {
    var txt = (lastSnap && lastSnap.errorCode) ? lastSnap.errorCode : 'E-00';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      } catch (e) { /* 复制失败不影响面板 */ }
    }
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  var retry = 0;

  /*
   * 兜底拉取：WS 只在宿主认为"有变化"时才推帧，空闲时可能长时间一帧没有。
   * 光等 onmessage 会让面板开着却是「未连接 / 全是 —」，看起来像坏了。
   * 所以连上那一刻、以及每次重连后，都直接用 HTTP 拉一次当前快照。
   */
  function pullOnce(endpoint) {
    if (!endpoint || typeof endpoint.url !== 'string') return;
    fetch(endpoint.url)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (snap) { if (snap) render(snap); })
      .catch(function () { /* 拉不到就等 WS，别把面板弄崩 */ });
  }

  function connect(endpoint) {
    var ws;
    try {
      ws = new WebSocket('ws://127.0.0.1:' + endpoint.port
        + '/dsh-washer/stream?token=' + encodeURIComponent(endpoint.token));
    } catch (e) { return; }
    ws.onopen = function () {
      retry = 0;
      pullOnce(endpoint);
    };
    ws.onmessage = function (ev) {
      try { render(JSON.parse(ev.data)); } catch (e) { /* 脏帧忽略 */ }
    };
    ws.onclose = function () {
      retry = Math.min(retry + 1, 5);
      setTimeout(reconnect, 500 * Math.pow(2, retry - 1));
    };
  }
  function reconnect() {
    if (!host) return;
    host.state().then(function (st) {
      if (st && st.endpoint) {
        // 不等 onopen：WS 握手要时间，这一发让面板立刻有数
        pullOnce(st.endpoint);
        connect(st.endpoint);
      } else setTimeout(reconnect, 2000);
    });
  }
  if (host) reconnect();
})();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ws://127.0.0.1:*;">
<title>dsh-washer</title>
<style>
  /*
   * 透明窗口里的悬浮洗衣机。
   * 整个页面背景透明，只有机器和气泡有底色——没有大卡片边框，
   * 机器就像真的摆在桌面上。
   */
  :root {
    color-scheme: dark;
    --bubble: rgba(20, 22, 28, .90);
    --text: #e8eaee;
    --dim: #8b929e;
    --ok: #2ee06a;
    --warn: #f5b93a;
    --bad: #e5484d;
    --run: #3aa0ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    cursor: default;
  }

  .wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
  }

  /* ---- 洗衣机 ---- */
  .machine {
    position: relative;
    /* 拖动只给机器顶部一条，其余留给交互 */
    width: 100%;
    display: flex;
    justify-content: center;
  }
  /* 甩干时整台机器会抖，这是它看起来"在工作"的关键 */
  .machine[data-shake="1"] { animation: shake .18s steps(2, end) infinite; }
  .machine[data-shake="2"] { animation: shake .09s steps(2, end) infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(1px, -1px); }
    100% { transform: translate(0, 1px); }
  }

  svg { display: block; image-rendering: pixelated; }
  /* 64x78 的像素画，按 1.75 倍放大到 112x136——整数倍会糊，非整数倍才锐 */
  .washer { width: 112px; height: 136px; }

  /* 水位：数值是 viewBox 用户单位，水层从 y27 铺到 y59 */
  .px-water { transform: translateY(calc(var(--water, 7) * 1px)); transition: transform .5s cubic-bezier(.32,.86,.3,1); }
  .px-foam { opacity: var(--foam, 0); transition: opacity .45s ease; }
  .px-led { fill: var(--led, #7c8896); }
  .machine[data-blink="1"] .px-led { animation: blink .6s steps(2, end) infinite; }
  .machine[data-blink="2"] .px-led { animation: blink .35s steps(2, end) infinite; }
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .3; } }

  /* 滚筒转动：绕玻璃圆心转 */
  .px-wheel {
    transform-origin: 31px 43px;
    animation: spin var(--spin-dur, 2.4s) linear infinite;
    animation-play-state: var(--spin-play, paused);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 气泡：状态 + 计时 ---- */
  .bubble {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bubble);
    color: var(--text);
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    transition: opacity .2s;
  }
  .bubble .st { font-weight: 600; }
  .bubble .st[data-s="idle"], .bubble .st[data-s="off"] { color: var(--dim); }
  .bubble .st[data-s="starting"], .bubble .st[data-s="washing"],
  .bubble .st[data-s="rinsing"], .bubble .st[data-s="spinning"],
  .bubble .st[data-s="draining"] { color: var(--run); }
  .bubble .st[data-s="waiting"] { color: var(--warn); }
  .bubble .st[data-s="done"] { color: var(--ok); }
  .bubble .st[data-s="error"] { color: var(--bad); }
  .bubble .tm { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* 没连上时气泡换成提示，机器保持暗淡 */
  .bubble[data-off="1"] { color: var(--dim); }
  .wrap[data-conn="lost"] .bubble { color: var(--bad); }

  /* ---- 右下角：始终可点的实体角落 ---- */
  /* 穿透开启时只有这里还能接收鼠标，是唯一的退出通道 */
  .corner {
    position: absolute;
    right: 0; bottom: 0;
    width: 18px; height: 18px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    color: rgba(255,255,255,.25);
    font-size: 10px;
    transition: color .2s, background .2s;
    -webkit-app-region: no-drag;
  }
  .corner:hover { color: rgba(255,255,255,.85); background: rgba(255,255,255,.12); }
  body[data-through="1"] .corner {
    color: #fff;
    background: rgba(58, 160, 255, .85);
    box-shadow: 0 0 8px rgba(58,160,255,.8);
  }
  /* 穿透时整机半透明，但角落保持清晰 */
  body[data-through="1"] .machine,
  body[data-through="1"] .bubble { opacity: .42; }
</style>
</head>

  <div class="bubble" id="bubble">
    <span class="st" id="st" data-s="off">未连接</span>
    <span class="tm" id="tm">--:--</span>
  </div>
  <div class="corner" id="corner" title="切换鼠标穿透">◱</div>
</div>

<script>
(function () {
  var LABEL = {
    off: '未连接', idle: '待机', starting: '启动中', washing: '洗涤中',
    rinsing: '漂洗中', spinning: '脱水中', waiting: '等你确认',
    draining: '排水换水', done: '洗完了', error: '故障',
  };
  // 和 src/core.js 的 VISUAL 一一对应；这里只保留悬浮窗用得到的四个量
  var VISUAL = {"off":{"water":7,"foam":0,"led":"#4a5560","blink":0,"spin":0},"idle":{"water":6.5,"foam":0,"led":"#7c8896","blink":0,"spin":0},"starting":{"water":3.5,"foam":0.3,"led":"#3aa0ff","blink":0,"spin":5},"washing":{"water":0.5,"foam":1,"led":"#3aa0ff","blink":0,"spin":2.4},"rinsing":{"water":0.5,"foam":0.6,"led":"#3aa0ff","blink":0,"spin":2.4},"spinning":{"water":4,"foam":0,"led":"#3aa0ff","blink":0,"spin":0.6},"waiting":{"water":4.5,"foam":0.2,"led":"#f5b93a","blink":0.6,"spin":0},"draining":{"water":7,"foam":0,"led":"#1f9aa8","blink":0,"spin":5},"done":{"water":6.5,"foam":0,"led":"#2ee06a","blink":0,"spin":0},"error":{"water":5,"foam":0,"led":"#e5484d","blink":0.35,"spin":0}};

  var el = function (id) { return document.getElementById(id); };
  var host = window.washerHost || null;
  var machine = el('machine');

  function setConn(kind) {
    el('wrap').dataset.conn = kind;
  }

  function render(snap) {
    var s = snap.state || 'off';
    var v = VISUAL[s] || VISUAL.idle;

    el('st').textContent = LABEL[s] || s;
    el('st').dataset.s = s;
    el('tm').textContent = snap.durationText || '--:--';

    machine.style.setProperty('--water', String(v.water));
    machine.style.setProperty('--foam', String(v.foam));
    machine.style.setProperty('--led', String(v.led));
    // spin 是"每秒转多少圈"，换算成动画时长；0 就暂停在静止档
    var spinDur = v.spin > 0 ? (1 / v.spin).toFixed(2) + 's' : '0s';
    machine.style.setProperty('--spin-dur', spinDur);
    machine.style.setProperty('--spin-play', v.spin > 0 ? 'running' : 'paused');

    // 甩干抖得最厉害，洗涤时轻微抖——这是"在干活"的体感
    machine.dataset.shake = s === 'spinning' ? '2' : (s === 'washing' || s === 'draining' ? '1' : '0');
    machine.dataset.blink = v.blink > 0 ? (v.blink < 0.5 ? '2' : '1') : '0';
  }

  /* 穿透切换：角落永远可点，点它就能退出来 */
  el('corner').addEventListener('click', function (e) {
    e.stopPropagation();
    if (host) host.toggleClickThrough();
  });
  if (host) {
    host.onClickThroughChange(function (on) {
      document.body.dataset.through = on ? '1' : '0';
    });
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      host.showMenu();
    });

    /*
     * 把角落按钮的位置告诉主进程。穿透时只有这块矩形接收鼠标事件，
     * 所以它必须在任何缩放下都准确——这里用 getBoundingClientRect 实测，
     * 不手算。
     */
    function reportCorner() {
      var r = el('corner').getBoundingClientRect();
      host.setCornerRect({ x: r.left, y: r.top, w: r.width, h: r.height });
    }
    reportCorner();
    window.addEventListener('resize', reportCorner);

    /* forward:true 时页面能收到 mousemove，靠它告诉主进程"光标动了，重算穿透" */
    document.addEventListener('mousemove', function () { host.pointer(); });
  }

  /* 断线重连：宿主重启后端口和 token 都会变，所以每次都重新问主进程 */
  var retry = 0;
  function connect(port, token) {
    var ws;
    try { ws = new WebSocket('ws://127.0.0.1:' + port + '/dsh-washer/stream?token=' + encodeURIComponent(token)); }
    catch (e) { setConn('lost'); return; }
    ws.onopen = function () { setConn('open'); retry = 0; };
    ws.onmessage = function (ev) {
      try { render(JSON.parse(ev.data)); } catch (e) { /* 脏帧忽略 */ }
    };
    ws.onclose = function () {
      setConn('lost');
      retry = Math.min(retry + 1, 5);
      setTimeout(reconnect, 500 * Math.pow(2, retry - 1));
    };
    ws.onerror = function () { setConn('lost'); };
  }
  function reconnect() {
    if (!host) return;
    host.state().then(function (st) {
      if (st && st.endpoint) connect(st.endpoint.port, st.endpoint.token);
      else setTimeout(reconnect, 2000);
    });
  }
  if (host) reconnect();
})();
</script>

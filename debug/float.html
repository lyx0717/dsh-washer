<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:* http://127.0.0.1:*;">
<title>dsh-washer</title>
<style>
  /*
   * 透明窗口里的悬浮洗衣机。
   * 整个页面背景透明，只有机器和气泡有底色——没有大卡片边框，
   * 机器就像真的摆在桌面上。
   */
  :root {
    color-scheme: dark;
    --bubble: rgba(26, 28, 34, .42);
    /* 文字垫底色：深玻璃用深色垫，正好把浅色字托出来 */
    --glass-ink-halo: rgba(16, 18, 22, .55);
    --text: #e8eaee;
    --dim: #8b929e;
    --ok: #2ee06a;
    --warn: #f5b93a;
    --bad: #e5484d;
    --run: #3aa0ff;
    /*
     * 切档动画的时长和曲线。曲线必须和主进程 animateBounds 的
     * smoothstep（3t²-2t³）对齐——原来是 .32,.72,0,1，起点斜率很大，
     * 一上来就冲出去，和窗口那边先慢后快的节奏互相打架，
     * 两边内容在同一帧里各走各的，看着就是卡。
     * .32,0,.68,1 是 CSS 里的 ease-in-out，形状和 smoothstep 基本一致。
     */
    --size-dur: 220ms;
    --size-ease: cubic-bezier(.32, 0, .68, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    cursor: default;
  }
  /*
   * 禁选中必须放在具体元素上，不能放 html/body。
   * 在 html/body 上写 user-select: none 会让整页的 -webkit-app-region: drag
   * 一起失效 —— Electron 的已知行为，表现为"拖拽区明明在，就是拖不动"。
   */
  .machine, .bubble { -webkit-user-select: none; user-select: none; }

  .wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    /*
     * 气泡不许贴着窗口底边放。
     *
     * 贴死时下边框、圆角、投影全被窗口边界切掉 —— 用户看到的是"一条被裁掉
     * 一半的横条"，既看不出是胶囊，也看不出它是浮在机器上的一层。
     * 留 8px 让投影有地方落下（阴影本身就占 2px 偏移 + 8px 模糊）。
     * 机器跟着上移的代价是显示高度少 8px，132px 宽的窗口装得下。
     */
    padding-bottom: 8px;
    box-sizing: border-box;
    /*
     * 尺寸档位切换的过渡。
     *
     * 原来 .wrap / .machine / .bubble 全都是"属性一改，下一帧就到位"，
     * 而主进程那边是直接 setBounds 改窗口大小——两头都是硬切，
     * 用户看到的就是"像卡顿"。这里补上过渡，和主进程的窗口动画同频率，
     * 内容是"边缩边挪"而不是先缩完再等着窗口变大。
     */
    transition: width var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
  }

  /* ---- 洗衣机 ---- */
  .machine {
    position: relative;
    /* 整机都是拖拽区（见 .grab） */
    width: 100%;
    display: flex;
    justify-content: center;
    /* 极简/正常切换时机器本体跟着缩，不是瞬间跳变 */
    transition: width var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                opacity 1.2s ease, filter 1.2s ease;
  }
  /* 甩干时整台机器会抖，这是它看起来"在工作"的关键 */
  .machine[data-shake="1"] { animation: shake .18s steps(2, end) infinite; }
  .machine[data-shake="2"] { animation: shake .09s steps(2, end) infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(1px, -1px); }
    100% { transform: translate(0, 1px); }
  }
  /*
   * 切状态的预备动作：极短的一次"吸气"。
   *
   * 为什么不缩整机：.machine 是撑满窗口宽度的 flex 容器，scale 会以中心为
   * 原点外扩——机身往上顶出窗口、往下压住气泡，而窗口是透明紧贴内容的，
   * 顶出去的部分直接被裁掉，看起来像"机器跳了一下"。
   * 改成只给机身（.skin-host）做缩放，transform-origin 钉在底部中心，
   * 像真机器那样"沉一下"，不会碰到气泡。
   *
   * 也不能复用 .machine 上的 transform：data-shake 已经在上面跑无限循环，
   * 两个 animation 抢同一个属性，后声明的直接覆盖前者——甩干时抖着抖着
   * 就停了。所以 pop 挂在子元素上，两套动画互不干扰。
   */
  .machine[data-pop="1"] > .skin-host { animation: pop .24s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop {
    0%   { transform: scale(1) translateY(0); }
    35%  { transform: scale(1.045) translateY(1px); }
    100% { transform: scale(1) translateY(0); }
  }
  .machine > .skin-host { transform-origin: 50% 100%; }

  svg { display: block; image-rendering: pixelated; }  /* 64x78 的像素画，按 1.75 倍放大到 112x136——整数倍会糊，非整数倍才锐 */
  .washer { width: 112px; height: 136px; }

  /*
   * 拖拽区：整台机器都能拖。
   *
   * 早期只给机器顶部一条 26px 高的带子，因为整机设 drag 会吞掉右键菜单。
   * 穿透开关的入口早就挪到设置页了，拖拽区就铺满整个机器本体——
   * 抓着机器上任何地方都能搬。
   *
   * 注意：app-region: drag 的区域里 Chromium 在 mousedown 时就接管做窗口
   * 拖动，页面**收不到 mouseup**。所以别往这层挂双击 / 单击之类的交互——
   * 一定会失灵，而且 CDP 注入的假鼠标事件是通的，只有真人操作失效，
   * 极难排查。要加点击交互就放到 .bubble 那种 no-drag 层上。
   *
   * 右键菜单不受影响：它是 document 级的 contextmenu 监听，
   * 而且 .wrap 本身是 no-drag。
   */
  .grab {
    /* 绝对定位会排在 SVG 之后、被 SVG 盖住，必须显式提层，
       否则鼠标点到的是 SVG，拖拽区收不到事件——实测就是这样失效的 */
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    app-region: drag;
    -webkit-app-region: drag;
    cursor: grab;
  }
  .grab:active { cursor: grabbing; }
  /* 拖拽区下面那层必须 no-drag，否则右键菜单落不到机器上 */
  .bubble { -webkit-app-region: no-drag; }

  /*
   * 本地完成横幅：浮窗自己说"跑完了"，不经过 macOS 通知中心。
   *
   * 盖在机器上三分之一的位置——那里是滚筒上半部，本来就是空白反光区，
   * 压在上面不挡关键信息（水位、面板都在下半部）。
   *
   * data-on 控制显隐，用 opacity+transform 而不是 display：
   * display 切换没法过渡，会硬闪一下。
   */
  .flash {
    position: absolute;
    left: 6px; right: 6px;
    /* 从机顶向上冒：bottom 由 JS 按机身高度算好（贴机身上沿），这里只是初值 */
    bottom: 150px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 9px;
    border-radius: 12px;
    /* 半透明深色底 + 细边，压在浅色机身上才看得清 */
    /* 液态玻璃：半透明填充 + 背景模糊饱和 + 上下咬边高光；不要外投影 */
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05)),
      rgba(24, 28, 34, 0.42);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.38),
      inset 0 -1px 0 rgba(0, 0, 0, 0.18);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px) scale(.96);
    transition: opacity 200ms ease, transform 200ms ease;
    max-height: 68px;
    overflow: hidden;
  }
  /* 朝下的小尾巴，指向机身——「洗衣机在跟你说话」的对话气泡感 */
  .flash::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -6px;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(30, 34, 42, 0.55);
  }
  .flash[data-on="1"] { opacity: 1; transform: translateY(0) scale(1); }
  .flash-t {
    width: 100%;
    text-align: center;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.25;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .flash-s {
    width: 100%;
    text-align: center;
    font-size: 10px;
    line-height: 1.25;
    color: rgba(255, 255, 255, 0.7);
    font-variant-numeric: tabular-nums;
    /* 说明文字最多两行，超出用省略号截断，不再顶出边框 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  /* 故障用红调，和机器指示灯的 error 色一致 */
  .flash[data-kind="error"] {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)),
      rgba(70, 20, 24, 0.42);
    border-color: rgba(229, 72, 77, 0.6);
  }
  .flash[data-kind="error"]::after { border-top-color: rgba(70, 20, 24, 0.55); }
  /* 等确认 / 卡住用琥珀调，和 waiting 状态的指示灯同色系 */
  .flash[data-kind="waiting"],
  .flash[data-kind="stalled"] {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04)),
      rgba(58, 44, 16, 0.4);
    border-color: rgba(245, 185, 58, 0.6);
  }
  .flash[data-kind="waiting"]::after,
  .flash[data-kind="stalled"]::after { border-top-color: rgba(58, 44, 16, 0.55); }
  /* 极简档只有 76px 宽，放不下两行字，直接不出横幅 */
  body[data-size="tiny"] .flash { display: none; }

  /*
   * 水位 / 泡沫 / 指示灯的颜色不再在这里定义 —— 它们和主界面是同一段 CSS
   * （style.css 的 .dw-px 段落），由 build-float.mjs 打包进造型样式表。
   * 这里只剩像素滚筒的转动：它只属于浮窗，主界面那个 32px sprite 转不转无所谓。
   */
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .3; } }

  /* 滚筒转动：绕玻璃圆心转 */
  .px-wheel {
    transform-origin: 31px 43px;
    animation: spin var(--spin-dur, 2.4s) linear infinite;
    animation-play-state: var(--spin-play, paused);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 气泡：状态 + 计时 ---- */
  .bubble {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    /*
     * iOS 液态玻璃（Liquid Glass）。
     *
     * 苹果那套的做法不是"半透明 + 模糊"这么简单，视觉上分三层：
     *   1. 厚度 —— backdrop blur+saturate 把背后的东西糊成有颜色的糖浆，
     *      而不是简单调暗。saturate 越高越"透亮"，低了就成磨砂塑料。
     *   2. 镜面 —— 上半部一道自上而下衰减的白光，模拟光从玻璃上方打进来。
     *      这是让人一眼认出"玻璃"而不是"半透明色块"的关键，纯 rgba 做不到。
     *   3. 咬边 —— 顶部一条更亮的内描边（光落在玻璃上边缘），
     *      底部一条深色内描边（背面反射），两条一起才有"厚度"。
     *
     * 底色用接近无色的深灰而不是原来的 rgba(20,22,28,.90)：那个浓度太高，
     * 背后什么都没透出来，再叠模糊也看不出是玻璃。
     */
    background: var(--bubble);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    /*
     * 描边 + 投影，让气泡在浅色背景上"浮起来"。
     *
     * 原来只有半透明深底，压在 precision 造型的白色外壳、或白色的浏览器窗口上时，
     * 边界和背景糊在一起——用户看不出这块是可交互的。
     * 一行描边定边界，一层投影定层级，比调背景色更管用：
     * 深色背景上描边几乎不可见，正好不抢戏。
     */
    box-shadow:
      /* 咬边：顶亮底暗，玻璃才有厚度 */
      inset 0 1px 0 rgba(255, 255, 255, .34),
      inset 0 -1px 0 rgba(0, 0, 0, .22),
      /* 一圈极细的外描边，浅色背景上定边界 */
      0 0 0 1px rgba(255, 255, 255, .18),
      /*
       * 投影只留一层短的。
       *
       * 原来是两层（近 6px + 远 20px 模糊），远的那层在 132px 宽的窗口里
       * 铺出十几像素的灰雾，视觉上像气泡"拖着一条尾巴"，把下边框糊掉了。
       * 玻璃本身已经有内描边和镜面定形状，投影只需要交代"离桌面一点点"。
       */
      0 1px 3px rgba(0, 0, 0, .22);
    color: var(--text);
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    cursor: default;
    /*
     * 宽度锁死 132px —— 和窗口同宽，气泡就是窗口的满宽。
     *
     * 原来靠内容撑：状态文字 + 计时 + 圆点，4 颗点时实测算出来 137px，
     * 比窗口还宽 5px，右边直接切在窗外。而且不同状态文字长度不一样，
     * 撑出来的宽度也在变（和主界面停靠条踩过同一个坑）。
     *
     * 锁死后用 space-between 分配：状态在左、圆点在右，中间的空档自然吃掉。
     */
    width: 132px;
    box-sizing: border-box;
    justify-content: space-between;
    /* 建独立层叠上下文：::before 的 z-index:-1 只退到气泡背景之上、文字之下，
       否则会一路掉到机器图层下面，高光就看不见了 */
    isolation: isolate;
    /* 气泡进出场：极简态要塌缩，所以 max-height/padding 一起过渡 */
    transition: opacity var(--size-dur, 220ms) ease,
                max-height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                padding var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                margin var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
    max-height: 30px;
  }
  /*
   * 悬停命中区扩大到紧贴气泡边缘，但不改布局。
   *
   * 气泡实际只有 ~24px 高（padding 3px 上下 + 11px 字号），鼠标稍微偏一点就
   * 离开，展开的列表会一路闪。不能靠加 padding 撑大——那会直接撑宽气泡，
   * 把圆点的空间吃掉。
   *
   * 只在**纵向**扩 10px、横向不扩：横向放宽会让本来落在气泡旁边的鼠标也算悬停，
   * 那就不是"悬停区域只有气泡"了。
   */
  .bubble::after {
    content: '';
    position: absolute;
    inset: -10px 0;
  }
  /*
   * 镜面高光层：上半部一道白色渐变，往下衰减到透明。
   *
   * 必须盖在文字底下（z-index 负 + 气泡自己 isolation），否则状态字被蒙上一层白。
   * border-radius: inherit 让它跟着胶囊裁剪，不会露出方角。
   */
  .bubble::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, .22) 0%,
      rgba(255, 255, 255, .07) 42%,
      rgba(255, 255, 255, 0) 100%
    );
    pointer-events: none;
  }
  /*
   * 文字描边：玻璃是透的，背后是什么颜色不受控。
   *
   * 实测气泡压在液晶屏（深色）上时，深色的计时文字几乎消失。
   * 给文字加一圈和玻璃同色的极细描边 —— 玻璃白就描白，玻璃黑就描黑，
   * 等于让文字自带一层"垫底"，无论背后透出什么都能读。
   * 用 text-shadow 而不是 -webkit-text-stroke：后者在 11px 上会把字糊成一团。
   */
  .bubble .st, .bubble .tm, .bubble .dots .more {
    text-shadow:
      0 0 2px var(--glass-ink-halo),
      0 0 3px var(--glass-ink-halo);
  }
  .bubble .st { font-weight: 600; }
  .bubble .st[data-s="idle"], .bubble .st[data-s="off"] { color: var(--dim); }
  .bubble .st[data-s="starting"], .bubble .st[data-s="washing"],
  .bubble .st[data-s="rinsing"], .bubble .st[data-s="spinning"],
  .bubble .st[data-s="draining"] { color: var(--run); }
  .bubble .st[data-s="waiting"] { color: var(--warn); }
  .bubble .st[data-s="done"] { color: var(--ok); }
  .bubble .st[data-s="error"] { color: var(--bad); }
  .bubble .tm { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* ---- 多会话指示灯 ----
   * 用户经常同时跑两三个 agent，只显示一个等于看不见其他的。
   * 一颗点 = 一个还活着的会话，颜色就是它的状态色。
   * 点一下钉住那个会话，再点一下放开（回到跟随最近活动）。
   */
  .dots {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 0 0 2px;
    /*
     * 右边收在气泡边框内侧 2px，和左边距对称。
     * 气泡 132px 宽、左右内边距各 9px，状态文字和计时吃掉 75px，
     * 留给圆点只剩 39px —— 4 颗点（6+4 一组）正好填满。
     * 第 5 个会话起靠悬停列表显示，不再往外顶。
     */
    margin: 0 2px 0 2px;
    /*
     * 宽度锁死 41px：3 颗点（6*3 + 4*2 = 26px）加一个「+N」（12px）+ 左边距。
     * flex:none 挡住收缩，overflow:hidden 兜底 —— 渲染端已经截断过，
     * 这里再挡一层是因为气泡一旦被撑宽，窗口外的东西就看不见了（132px 硬边界）。
     */
    flex: none;
    width: 41px;
    overflow: hidden;
    border-left: 1px solid rgba(255, 255, 255, .12);
    -webkit-app-region: no-drag;
  }
  .dots:empty { display: none; }
  .dots i {
    /*
     * flex-shrink: 0 是必须的。
     * .dots 宽度锁 39px，加上「+N」后总内容超出容器，浏览器默认会压缩所有
     * flex 子项 —— 实测圆点从 6px 被压成 4px，彩色小球变成模糊的点，
     * 状态颜色基本分不出来。宁可让 +N 自己占位，也不许点缩。
     */
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    cursor: pointer;
    position: relative;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  /* 视觉只有 6px，但热区用 ::before 撑到 18px：Fitts 定律，6px 点不稳。 */
  .dots i::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
  }
  .dots i:hover { transform: scale(1.5); }
  /* 钉住的那颗带一圈光晕，否则用户不知道自己钉着 */
  .dots i[data-pinned="1"] { box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
  .dots i[data-s="idle"], .dots i[data-s="off"] { background: var(--dim); }
  .dots i[data-s="starting"], .dots i[data-s="washing"],
  .dots i[data-s="rinsing"], .dots i[data-s="spinning"],
  .dots i[data-s="draining"] { background: var(--run); }
  .dots i[data-s="waiting"] { background: var(--warn); }
  .dots i[data-s="done"] { background: var(--ok); }
  .dots i[data-s="error"] { background: var(--bad); }
  /* 溢出计数：第 4 格位置写「+N」，比再挤一颗点有用——它告诉用户"还有几个" */
  .dots .more {
    flex: none;
    font-size: 9px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--dim);
    margin-left: -1px;
    pointer-events: auto;
    cursor: pointer;
    padding: 0 1px;
  }
  .dots .more:hover, .dots .more:focus-visible { color: var(--text); }
  /* 极小态放不下，藏掉——那颗机器本身已经在报状态了 */
  body[data-size="tiny"] .dots { display: none; }


  /* 没连上时气泡换成提示，机器保持暗淡 */
  .bubble[data-off="1"] { color: var(--dim); }
  .wrap[data-conn="lost"] .bubble { color: var(--bad); }

  /* ---- 穿透态 ---- */
  /*
   * 穿透时整机半透明，提示"现在点不到我"。
   * 以前右下角还挂一个亮蓝色按钮当退出通道，现在退出走两个地方：
   * 设置页的开关、⌥⌘W 全局快捷键——按钮就没必要了，而且是穿进机器里的一块异物。
   */
  body[data-through="1"] .machine,
  body[data-through="1"] .bubble { opacity: .42; }

  /* ---------- 门外道具层 ---------- */
  /*
   * 视频里那套"动画语法"的关键不在滚筒转多快，而在机身之外的反应：
   * 等人时头顶飘一个问号、故障时一道闪电、洗完亮三颗星。
   * 我们的表达原来全缩在机身里 + 一颗 7px 小灯，所以机器在动但没情绪。
   *
   * 实现约束（踩过就知道）：
   * - 必须 pointer-events:none。.grab 是整机拖拽区，道具层压在它上面会
   *   把拖拽吃掉，表现为"机器突然拖不动了"。
   * - 只能动 transform / opacity。透明置顶窗口里动 width/left 会每帧重排，
   *   功耗直接翻倍，笔记本上很明显。
   * - 道具层贴在机器上沿之上，不占布局（position:absolute），
   *   否则窗口内容会变高，把气泡顶出可见区。
   */
  .props {
    /*
     * 道具层压在机身顶部那一条上（bottom:100% 即机器上沿）。
     * 高度 22px 而不是 34px：窗口只有 200px 高，机器 136 + 气泡约 24，
     * 上方只剩约 40px 余量，再高就顶到窗口边缘被裁掉。
     * 每个道具各自用 bottom 精确定位，不用 flex 对齐——三个道具形状不同，
     * flex-end 会让它们按各自盒模型贴底，看起来高低不齐。
     */
    /*
     * bottom: calc(100% + 2px)：留 2px 呼吸缝。
     * 贴死 100% 时，道具层最低那 6px 会被机器的圆角/描边压住——
     * 待机呼吸光和星星底座正好卡在那儿，看起来像被削掉半截。
     */
    position: absolute;
    left: 0; right: 0; bottom: calc(100% + 2px);
    height: 20px;
    pointer-events: none;
    z-index: 20;
  }
  /*
   * 居中的做法很关键：所有道具都用 left: calc(50% - 半宽) 而非
   * left:50% + transform:translateX(-50%)。
   *
   * 因为问号/闪电/呼吸光各自都有 transform 动画（pop-in / hover / twitch /
   * glow-breathe），keyframes 里的 transform 会整个替换掉元素上的
   * transform 值——translateX(-50%) 一旦被覆盖，道具会当场右跳半个宽度，
   * 动画结束又跳回来，看着就是"抖了一下"。
   * 用 left 做居中，transform 就能完全留给动画自由使用。
   */
  .props > * {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
  }

  /* 等待确认：头顶一个问号，慢慢上下浮，门缝透出暖光 */
  .props .p-q {
    font: 700 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--warn);
    text-shadow: 0 0 8px rgba(245, 185, 58, .75);
    bottom: 1px;
    left: calc(50% - 4px);   /* 问号字面偏左，用 -4px 让视觉重心落在中线上 */
  }
  .machine[data-state="waiting"] .props .p-q {
    animation: pop-in .28s cubic-bezier(.34, 1.56, .64, 1) both,
               hover 2.2s ease-in-out .28s infinite;
  }
  .machine[data-state="waiting"] .door,
  .machine[data-state="waiting"] .dw-pw .door {
    filter: drop-shadow(0 0 6px rgba(245, 185, 58, .55));
  }

  /* 故障：一道闪电，高频短促地抽动一下再停 */
  .props .p-bolt {
    font: 700 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--bad);
    text-shadow: 0 0 9px rgba(229, 72, 77, .8);
    bottom: 0;
    left: calc(50% - 8px);   /* ⚡ 字形更宽，半宽约 8px */
  }
  .machine[data-state="error"] .props .p-bolt {
    animation: pop-in .18s ease-out both,
               twitch .72s steps(1, end) .18s infinite;
  }

  /* 洗完了：三颗星依次亮起，然后一起淡下去（只演一轮，不吵） */
  .props .p-stars { display: flex; gap: 3px; bottom: 3px; left: calc(50% - 10.5px); }  /* 3*5px + 2*3px = 21px，半宽 10.5 */
  /*
   * 星星的居中同样只靠 left 算出来（21px 宽），容器本身不带 transform，
   * 这样每颗星的 star-pop 可以放心用 scale。若改成 translateX(-50%)，
   * 子元素的 scale 不会波及父级，但父级一旦被 keyframes 写 transform
   * 居中就会失效——保持容器无 transform 是最省心的写法。
   */
  .props .p-stars i {
    width: 5px; height: 5px;
    background: var(--ok);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    box-shadow: 0 0 5px var(--ok);
  }
  .machine[data-state="done"] .props .p-stars {
    animation: stars-run 3.2s ease-out both;
  }
  .machine[data-state="done"] .props .p-stars i:nth-child(1) { animation: star-pop .34s ease-out both; }
  .machine[data-state="done"] .props .p-stars i:nth-child(2) { animation: star-pop .34s .12s ease-out both; }
  .machine[data-state="done"] .props .p-stars i:nth-child(3) { animation: star-pop .34s .24s ease-out both; }

  /* 待机：一团缓慢呼吸的冷光，安静但不死 */
  .props .p-glow {
    bottom: 5px; width: 26px; height: 8px; left: calc(50% - 13px); border-radius: 50%;
    /*
     * 呼吸光要"看得见但不抢戏"。
     * 初版透明度 .55 再叠 blur(2px)，在深色桌面上等于消失——
     * 截图里只剩一道灰雾，跟没加一样。
     * 提亮到 .8、去掉 blur（blur 会把它摊成一团平均色，反而更看不见），
     * 改用两层径向渐变做出中间实、边缘虚的灯罩感。
     */
    background:
      radial-gradient(ellipse at 50% 50%, rgba(150, 210, 255, .8), rgba(120, 180, 235, .25) 55%, transparent 76%);
  }
  .machine[data-state="idle"] .props .p-glow { animation: glow-breathe 5.5s ease-in-out infinite; }
  .machine[data-state="off"] .props > * { animation: none; opacity: 0; }

  /*
   * 极简态（64px 机器）里道具会挤成一坨糊，整层关掉——
   * 那个档位的定位本来就是"只剩指示灯"。
   */
  body[data-size="tiny"] .props { display: none; }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(.4) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes hover {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes twitch {
    0%, 42%, 100% { transform: translateX(0); }
    43%, 51%      { transform: translateX(-2px); }
    47%, 55%      { transform: translateX(2px); }
  }
  @keyframes star-pop {
    from { opacity: 0; transform: scale(.2); }
    60%  { opacity: 1; transform: scale(1.25); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes stars-run {
    0%, 62% { opacity: 1; }
    100%    { opacity: .34; }
  }
  @keyframes glow-breathe {
    0%, 100% { opacity: .18; transform: scale(.86); }
    50%      { opacity: .5;  transform: scale(1.06); }
  }
  /*
     极简档洗完没有横幅也没有气泡，只剩一圈静态绿光——余光里分不出来。
     让它闪两下：亮起、落回、再亮起，然后停在常态亮度上。
     首尾必须等于常态光晕值，否则动画一结束画面会跳一下。
     亮靠提亮、不靠放大：机器离窗口左右边只剩约 5px，半径一过 5px
     光晕就顶到边界被切出一条硬线（实测 9px 时四边全贴死、整圈削平）。
     所以峰值半径只到 4.5px，把"闪"交给透明度 .45 → .95 去做。
   */
  @keyframes tiny-done-flash {
    0%, 100% { filter: drop-shadow(0 0 3.5px rgba(46, 224, 106, .45)); }
    18%      { filter: drop-shadow(0 0 4.5px rgba(46, 224, 106, .95)); }
    38%      { filter: drop-shadow(0 0 3.5px rgba(46, 224, 106, .45)); }
    58%      { filter: drop-shadow(0 0 4.5px rgba(46, 224, 106, .95)); }
  }

  /* ---------- 尺寸档位 ---------- */
  /*
   * 不要把窗口尺寸写死在页面里。
   *
   * 踩过的坑：这里曾写死 `body[data-size="normal"] .wrap{width:240px;height:308px}`，
   * 但主进程那边还是旧窗口尺寸（132x200）时，240 宽的 .wrap 会被窗口裁掉大半，
   * 用户看到的就是"洗衣机只剩一块儿"。
   * 现在 .wrap 保持 100%，机器按 window.innerWidth 缩放，窗口多大都完整。
   */
  /* 新版把所有文字收进机身黑条，原独立气泡停用（保留 DOM 供旧 JS 读写不报错） */
  .bubble { display: none !important; }
  /*
     黑条字号补偿。机身面板是按 330px 设计稿排的版，窗口只有 158px 宽时
     整机被缩到 0.48 倍，面板里 15px 的状态字实际只有 7px——看不清。
     这里把面板字号按缩放比反向放大，并收窄内边距，保证 158px 宽下
     状态/待动错/计时都在 8–11px，既不溢出也读得清。只作用于浮窗。
  */
  #skinHost .dw-pw .panel { padding: 6px 7px; }
  #skinHost .dw-pw .state-text { font-size: 23px; }
  #skinHost .dw-pw .counts { gap: 4px; }
  #skinHost .dw-pw .cnt { font-size: 18px; padding: 1px 5px; }
  #skinHost .dw-pw .timer { font-size: 18px; }
  /*
     .wrap 底部那 8px 是给气泡投影留的，极简档气泡高度塌成 0、根本不投影，
     这 8px 全是白扔。留 2px 收边，腾出的 6px 挪到机器头顶——
     机器顶距从 4px 变 10px，按比例缩小的光晕才不会被窗口上沿切平。
   */
  body[data-size="tiny"] .wrap { padding-bottom: 2px; }
  body[data-size="tiny"] .washer { width: 64px; height: 78px; }
  /*
     极简态气泡不占位。但不能直接 display:none —— 那样没有过渡，
     气泡会"啪"地消失。改成高度塌缩 + 透明，结束再真正隐藏。
   */
  body[data-size="tiny"] .bubble {
    opacity: 0;
    max-height: 0;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }
  /* 极简态没有气泡，指示灯要自己发光；整机那圈状态光见下面"状态光"一节 */


  /* ---------- 状态灯 ---------- */
  /*
   * 以前浮窗在机器右上角外挂了一颗独立的圆灯。问题是三套造型本来就
   * 各自带着自己的指示灯——像素是机身上的 .px-led、精密家电是面板上的
   * .led、精密家电是液晶屏那道发光条——再挂一颗悬在最外层的灯，
   * 怎么看都是贴在机器身上的异物，而不是机器的一部分。
   *
   * 现在只用造型自带的灯：把状态色注入 --led，由各造型的 CSS 自己消化。
   * 那套皮肤本来就在主界面 dock 里正常工作，浮窗复用同一份样式表，
   * 所以不需要第二套灯光逻辑。
   */
  .machine { position: relative; }
  /* 等待确认和故障要闪，其余状态常亮——闪是"需要人看一眼"的信号 */
  /* 闪烁由各造型自己的 [data-blink] 规则驱动，这里不重复写 */
  body[data-size="tiny"] .dw-px .px-led { filter: drop-shadow(0 0 4px var(--dw-led, #7c8896)); }
  body[data-size="tiny"] .dw-pw .led { filter: drop-shadow(0 0 4px var(--dw-sig-run)); }

  /* ---------- 造型选择 ---------- */
  /* 三套造型由 float.machines.js 生成 DOM 和 CSS，这里只管摆放。
     方案 B：窗口固定宽度，三套造型都缩放到同一宽度，
     所以外层 .machine 的尺寸在三套之间保持一致，切换时不跳。 */
  /*
   * transform-origin 必须是 0 0。
   * 默认锚点在元素中心，scale(0.34) 会把内容往四周收缩的同时把左上角
   * 推到 (70%,70%) 的位置——机器就整个跑到窗口右下角外面去了。
   *
   * 选择器不能写成 .machine > .dw-frame-inner：中间隔着 skinHost 这一层。
   */
  .machine .dw-frame { display: block; position: relative; }
  .machine .dw-frame .dw-frame-inner { transform-origin: 0 0; }
  /* 精密家电造型靠自带的 transition 表达水位，像素图靠 --water */
  body[data-size="tiny"] .machine > .dw-frame { transform-origin: top left; }

  /* ---------- 主题：跟随宿主 GUI（dock 同款明暗） ---------- */
  /*
   * Web 端把宿主 documentElement 是否带 data-ds-dark-theme 量出来，
   * 经 /dsh-washer/prefs 送到主进程，再推给这里，落到 body[data-theme]。
   * - light：白底气泡、深字，机器用亮色材质（--dw-* 默认值本身就是亮色）。
   * - dark ：深底气泡、浅字，机器换成暗色材质（下面这段覆盖 --dw-*）。
   * 机器材质的暗色值直接搬主界面 [data-ds-dark-theme] 那套，保证两边同款。
   */
  body[data-theme="light"] {
    color-scheme: light;
    --bubble: rgba(255, 255, 255, .72);
    --glass-ink-halo: rgba(255, 255, 255, .75);
    --text: #1b2430;
    --dim: #6b7684;
  }
  body[data-theme="light"] .bubble {
    /* 白玻璃：高光换成灰的（白底上白色高光看不出来），底部反射加重一点 */
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .90),
      inset 0 -1px 0 rgba(20, 40, 70, .10),
      0 0 0 .5px rgba(20, 40, 70, .12),
      0 1px 3px rgba(20, 40, 70, .10);
  }
  body[data-theme="light"] .bubble::before {
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, .80) 0%,
      rgba(255, 255, 255, .30) 45%,
      rgba(255, 255, 255, 0) 100%
    );
  }
  body[data-theme="dark"] .washerskin,
  body:not([data-theme="light"]) .washerskin {
    --dw-body-1: #4c5762;
    --dw-body-2: #39434e;
    --dw-body-3: #28313a;
    --dw-body-4: #1b2229;
    --dw-body-edge: rgba(255, 255, 255, 0.16);
    --dw-body-shade: rgba(0, 0, 0, 0.55);
    --dw-chrome-1: #b9c4cf;
    --dw-chrome-2: #6b7885;
    --dw-chrome-3: #3a444f;
    --dw-chrome-4: #8b98a5;
    --dw-glass-1: rgba(120, 180, 215, 0.55);
    --dw-glass-2: rgba(46, 96, 130, 0.6);
    --dw-glass-3: rgba(14, 38, 58, 0.9);
    --dw-glass-4: rgba(4, 12, 20, 0.97);
    --dw-water-1: #6fc3e6;
    --dw-water-2: #2b7ea8;
    --dw-water-3: #17546f;
    --dw-sig-run: #4aa3f0;
    --dw-sig-wait: #f0b73a;
    --dw-sig-err: #f26064;
    --dw-sig-ok: #3fbf7a;
    --dw-sig-off: #4c5762;
    /* 立体投影：浮窗的机身同样被缩到 64/112px，机身内的影子会一起缩没，
       所以阴影由缩放框按屏幕像素补（规则在 skin-precision.css） */
    --dw-frame-halo: rgba(0, 0, 0, 0.55);
    --dw-frame-drop: rgba(0, 0, 0, 0.5);
  }
  /* ---------- 状态光：整机被状态色"照亮" ---------- */
  /*
   * 视频里每个镜头都有这层光晕，是"远看就知道在忙什么"的关键。
   * 我们的状态色早就有（--led / --dw-sig），但只落在一颗 7px 小灯上。
   *
   * 做法是把同一个颜色加成门圈/机身的外发光，而不是新造一套配色——
   * 一旦两处颜色不同源，迟早会互相打架（主题切换时尤其明显）。
   * glow 半径刻意压小：透明窗口上大半径 box-shadow 是逐像素算的，
   * 半径翻倍功耗大概翻两番，80px 的物件上 12px 已经够看。
   */
  .machine > .skin-host {
    --glow: transparent;
    transition: filter .5s ease;
    filter: drop-shadow(0 0 0 transparent);
  }
  .machine[data-state="starting"] > .skin-host,
  .machine[data-state="washing"] > .skin-host,
  .machine[data-state="rinsing"] > .skin-host,
  .machine[data-state="spinning"] > .skin-host,
  .machine[data-state="draining"] > .skin-host {
    --glow: rgba(58, 160, 255, .55);
    filter: drop-shadow(0 0 7px var(--glow));
  }
  .machine[data-state="waiting"] > .skin-host { filter: drop-shadow(0 0 7px rgba(245, 185, 58, .5)); }
  .machine[data-state="error"] > .skin-host { filter: drop-shadow(0 0 8px rgba(229, 72, 77, .6)); }
  .machine[data-state="done"] > .skin-host { filter: drop-shadow(0 0 6px rgba(46, 224, 106, .45)); }
  /* 待机不要发光，静就得真的静 */
  .machine[data-state="idle"] > .skin-host,
  .machine[data-state="off"] > .skin-host { filter: none; }
  /*
     极简档也要发光，只是按机器尺寸同比缩小。
     正常档机器宽 112px、半径 6~8px；极简档机器只有 64px，
     半径照搬的话 8px 光晕裹着 64px 的机器，看着像一团雾不像一台机在发亮。
     64/112 ≈ 0.571，取 3.5~4.5px。
     这块以前是 `filter: none`，注释理由是"状态全靠机器自己的指示灯表达"——
     实际效果是远看分不出在等确认还是在故障，只剩一颗 4px 的小灯在闪。
   */
  body[data-size="tiny"] .machine[data-state="starting"] > .skin-host,
  body[data-size="tiny"] .machine[data-state="washing"] > .skin-host,
  body[data-size="tiny"] .machine[data-state="rinsing"] > .skin-host,
  body[data-size="tiny"] .machine[data-state="spinning"] > .skin-host,
  body[data-size="tiny"] .machine[data-state="draining"] > .skin-host {
    filter: drop-shadow(0 0 4px rgba(58, 160, 255, .55));
  }
  body[data-size="tiny"] .machine[data-state="waiting"] > .skin-host {
    filter: drop-shadow(0 0 4px rgba(245, 185, 58, .5));
  }
  body[data-size="tiny"] .machine[data-state="error"] > .skin-host {
    filter: drop-shadow(0 0 4.5px rgba(229, 72, 77, .6));
  }
  body[data-size="tiny"] .machine[data-state="done"] > .skin-host {
    filter: drop-shadow(0 0 3.5px rgba(46, 224, 106, .45));
    animation: tiny-done-flash 1.8s ease-out 1 both;
  }
  /*
     吸气(pop)和洗完闪光都要写 animation，而 animation 是同一个属性，
     两条规则只会互相覆盖、不会叠加。同时命中时合并成一条，否则洗完那一下
     要么不吸气、要么不闪。
   */
  body[data-size="tiny"] .machine[data-state="done"][data-pop="1"] > .skin-host {
    animation: pop .24s cubic-bezier(.34, 1.56, .64, 1), tiny-done-flash 1.8s ease-out 1 both;
  }
  body[data-size="tiny"] .machine[data-state="idle"] > .skin-host,
  body[data-size="tiny"] .machine[data-state="off"] > .skin-host { filter: none; }

  /* ---------- 减弱动态 / 不可见时暂停 ---------- */
  /*
   * 减弱动态效果时，门外道具只保留"亮/不亮"的静态信息，不再飘、不再抖。
   * 必须自己写：style.css 里那几条 @media 只覆盖 dock 的 sprite，
   * 浮窗是另一个页面，样式表不通。
   */
  /* ---- 彩蛋层：打盹变暗 / 空闲轻抖 ----
     纯装饰，不依赖新数据源，只在静息态触发；减弱动效时由上面的
     @media 统一关掉动画（变暗是颜色过渡不算动效，仍然保留）。 */
  body[data-doze="1"] .machine { opacity: .4; filter: saturate(.5) brightness(.85); }
  .machine[data-idle-shake="1"] { animation: idle-shake .65s ease-in-out; }
  @keyframes idle-shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-1.5px); }
    70% { transform: translateX(1.5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    /*
       `.machine[data-pop="1"]` 写的是机器自己，可 pop 动画挂在
       `.machine[data-pop="1"] > .skin-host` 上——这条以前其实没关掉它。
       洗完的闪光同理，也挂在 .skin-host 上，一起在这里关。
    */
    .machine, .machine > .skin-host, .props > * { animation: none !important; }
    .machine[data-state="waiting"] .props .p-q,
    .machine[data-state="error"] .props .p-bolt,
    .machine[data-state="done"] .props .p-stars,
    .machine[data-state="idle"] .props .p-glow { opacity: .9; }
  }
  /*
   * 窗口不可见时停掉动画。
   * 透明置顶窗口被完全遮住时 Chromium 不一定停合成器，动画照跑、白烧电。
   * visibilitychange 是这里唯一可靠的信号（见脚本里的监听）。
   */
  html[data-hidden="1"] .machine,
  html[data-hidden="1"] .props > *,
  html[data-hidden="1"] .px-wheel { animation-play-state: paused !important; }

</style>
</head>
<body data-size="normal" data-skin="precision" data-theme="dark">
<div class="wrap" id="wrap" data-conn="idle">
  <div class="machine" id="machine" data-blink="0" data-shake="0"
       style="--water:7;--foam:0;--led:#7c8896;--spin-dur:0s;--spin-play:paused">
    <div class="grab" id="grab"></div>
    <!-- 门外道具层：问号 / 闪电 / 三颗星 / 待机呼吸光，全部由 data-state 驱动 -->
    <div class="props" aria-hidden="true">
      <span class="p-q">?</span>
      <span class="p-bolt">⚡</span>
      <span class="p-stars"><i></i><i></i><i></i></span>
      <span class="p-glow"></span>
    </div>
    <div class="skin-host washerskin" id="skinHost"></div>
  </div>
  <div class="bubble" id="bubble">
    <span class="st" id="st" data-s="off">未连接</span>
    <span class="tm" id="tm">--:--</span>
    <span class="dots" id="dots" role="group" aria-label="会话"></span>
    <!-- 悬停气泡后向下平铺的全部会话。挂在 .bubble 里是为了跟着气泡定位 -->
  </div>
  <!--
    本地完成横幅。

    为什么要它：macOS 上 Electron 的通知可能是死的（这台机器的
    Electron.app 是 adhoc 签名，系统直接拒绝授权 —— 详见 main.cjs
    里 showScriptNotification 的注释）。系统通知发不出来时，
    至少让"跑完了"这件事在窗口里看得见。

    盖在机器上方而不是塞进气泡：气泡那行已经放着状态、计时、
    会话圆点，横向空间用满了，再挤会看不清。浮窗总共才 132×200。
  -->
  <div class="flash" id="flash" role="status" data-on="0">
    <span class="flash-t" id="flashT"></span>
    <span class="flash-s" id="flashS"></span>
  </div>
</div>

<script src="./float.machines.js"></script>
<script>
(function () {
  var LABEL = {
    off: '未连接', idle: '待机', starting: '启动中', washing: '洗涤中',
    rinsing: '漂洗中', spinning: '脱水中', waiting: '等你确认',
    draining: '排水换水中', done: '洗完了', error: '故障',
  };
  /* 错误码 → 一句话人话。浮窗只有 132px，说「能怎么办」比甩个 E-xx 有用；
     原始 code 仍由 Host 下发（详情面板对日志用），这里只负责翻译给人看。 */
  var ERR_HUMAN = {
    'E-10': '模型账号不可用',
    'E-20': '工具执行失败',
    'E-21': '审批被拒',
    'E-30': '上下文超长',
    'E-40': '任务被中断',
    'E-50': '被策略拦截',
    'E-00': '未知故障',
  };
  // 和 src/core.js 的 VISUAL 一一对应；这里只保留悬浮窗用得到的四个量
  var VISUAL = {"off":{"water":7,"foam":0,"led":"#4a5560","blink":0,"spin":0},"idle":{"water":6.5,"foam":0,"led":"#7c8896","blink":0,"spin":0},"starting":{"water":3.5,"foam":0.3,"led":"#3aa0ff","blink":0,"spin":5},"washing":{"water":0.5,"foam":1,"led":"#3aa0ff","blink":0,"spin":2.4},"rinsing":{"water":0.5,"foam":0.6,"led":"#3aa0ff","blink":0,"spin":2.4},"spinning":{"water":4,"foam":0,"led":"#3aa0ff","blink":0,"spin":0.6},"waiting":{"water":4.5,"foam":0.2,"led":"#f5b93a","blink":0.6,"spin":0},"draining":{"water":7,"foam":0,"led":"#1f9aa8","blink":0,"spin":5},"done":{"water":6.5,"foam":0,"led":"#2ee06a","blink":0,"spin":0},"error":{"water":5,"foam":0,"led":"#e5484d","blink":0.35,"spin":0}};

  var el = function (id) { return document.getElementById(id); };
  var host = window.washerHost || null;
  var machine = el('machine');

  function setConn(kind) {
    el('wrap').dataset.conn = kind;
  }

  /*
   * 当前造型与上次渲染的状态。机械造型重建有成本（精密家电有几十个节点），
   * 所以只在造型或状态真的变了才重建——每秒一次的计时刷新不该重画整台机器。
   */
  var curSkin = 'precision';
  var curState = null;

  /**
   * 状态灯：浮窗自己的，不是像素图里那个。
   *
   * 像素图里的 LED 是 10×10 的像素细节，缩放到 112px 宽后只有十来个屏幕像素，
   * 红蓝绿在上面根本分不出来。浮窗要承担"状态播报"的职责，所以单独给一个
   * 够大、带光晕的圆点——这不是重复，是把信息从细节里解放出来。
   */
  /*
   * 状态色写进机器容器，由造型自己的灯去消化（见上面「状态灯」那段注释）。
   * 以前这里操作的是外挂的 .lamp 元素，那颗灯已经删了。
   */
  function paintLamp(s) {
    var machine = el('machine');
    if (machine === null) return;
    var v = VISUAL[s] || VISUAL.idle;
    machine.style.setProperty('--led', v.led);
  }

  var curPanelSig = '';
  function buildMachine(snap) {
    var connLost = el('wrap').dataset.conn === 'lost';
    var s = snap.state || 'off';
    var c = connLost ? { waiting: 0, running: 0, error: 0 }
      : (snap.counts || { waiting: 0, running: 0, error: 0 });
    // 衣物=正在运行的会话数（最多 6 件），每件挂真实 sessionId
    var runIds = [];
    if (!connLost && snap.sessions) {
      for (var ri = 0; ri < snap.sessions.length && runIds.length < 6; ri++) {
        var rs = snap.sessions[ri].state;
        if (rs === 'starting' || rs === 'washing' || rs === 'rinsing' || rs === 'spinning' || rs === 'draining') {
          runIds.push(snap.sessions[ri].sessionId);
        }
      }
    }
    var errCode = s === 'error' && snap.errorCode ? ' · ' + snap.errorCode : '';
    var label = connLost ? '连接断开' : (LABEL[s] || s) + errCode;
    var sig = s + '|' + label + '|' + c.waiting + ',' + c.running + ',' + c.error + '|' + runIds.join(',');
    if (sig === curPanelSig && el('skinHost').firstChild !== null) return;
    curPanelSig = sig;
    var hostNode = el('skinHost');
    // 机身左右各留 10px 给投影/状态光，贴着窗口边会被直接裁掉。
    // 正常档：窗口宽 −20（旧版就是 132 窗口里的 112 机身，比例不变）；
    // 极简档：固定 64px。
    var width = Math.max(40, (window.innerWidth || 132) - 20);
    if (document.body.dataset.size === 'tiny') width = 64;
    hostNode.textContent = '';
    // --dw-* 变量挂在 .washerskin 上，[data-state] 的状态色绑定也靠这个容器，
    // 忘了同步就会用上一轮的状态配色（灯红了机器还蓝着）
    hostNode.setAttribute('data-state', s);
    if (window.WasherMachines) {
      hostNode.appendChild(window.WasherMachines.build(
        curSkin, s, width, snap.durationText || '--:--', s === 'waiting', c, label, runIds));
    }
    // 通知气泡贴机身上沿：底边 = 机身底留白(8) + 机身高 + 6px 尾巴间隙
    var fb = el('flash');
    if (fb) {
      var mh = Math.round(((window.innerWidth || 132) - 20) * (425 / 330));
      fb.style.bottom = (mh + 14) + 'px';
    }
    curState = s;
  }

  /* 计时每秒都在变，但不能每秒重建整台机器：只改机身黑条里的那一格文字。 */
  function updatePanelTimer(snap) {
    var hostNode = el('skinHost');
    if (!hostNode) return;
    var t = hostNode.querySelector('.timer');
    if (t) t.textContent = durationOf(snap.state || 'off', snap);
  }

  /* 窗口尺寸变化（主进程 animateBounds / 换档位）后，机器要按新宽度重新缩放，
     否则会拿旧宽度画、撑出窗口被裁掉。 */
  window.addEventListener('resize', function () {
    curPanelSig = '';
    if (lastSnap) buildMachine(lastSnap);
  });

  /*
   * 多会话指示灯。
   *
   * 只在真的有多个会话时才出现——一个会话时挂一颗孤零零的点
   * 纯属噪音（布局本身就该把话说清楚）。
   *
   * 点一下钉住那个会话，再点一下放开。钉住态靠 data-pinned 那圈光晕表达，
   * 不加文字说明：窗口只有 132px 宽，一行说明会把机器挤没。
   */
  var lastDotsSig = '';
  /*
   * 气泡里最多站 3 颗点，第 4 格放「+N」。
   *
   * 为什么是 3 不是 4：132px 宽减去内边距(18)、状态文字(33)、计时(31)、
   * 间距，点区只剩 39px。3 颗点是 26px，「+N」还要 13px 左右 —— 3 颗点
   * 加一个 +N 正好填满，4 颗点就没地方标明"还剩几个"了。
   *
   * 排序由 Host 的 sessionSummaries 给（紧急的在前），这里只负责截断，
   * 所以「等待/故障永远优先显示」是数据侧保证的，不靠这里挑。
   */
  var MAX_DOTS = 3;
  function renderDots(snap) {
    var box = el('dots');
    if (box === null) return;
    var all = Array.isArray(snap.sessions) ? snap.sessions : [];
    if (all.length < 2) {
      if (lastDotsSig !== '') { box.textContent = ''; lastDotsSig = ''; }
      return;
    }
    var pinned = snap.pinnedSessionId || null;
    /*
     * 钉住的那个会话如果排在 3 名开外，要把它顶到可见位置。
     * 否则用户钉了却看不见 —— 钉住的意义就是"我一直盯这个"。
     */
    var list = all.slice(0, MAX_DOTS);
    if (pinned !== null) {
      var pinnedIdx = -1;
      for (var i = 0; i < all.length; i++) { if (all[i].sessionId === pinned) { pinnedIdx = i; break; } }
      if (pinnedIdx >= MAX_DOTS) list[MAX_DOTS - 1] = all[pinnedIdx];
    }
    var overflow = all.length - list.length;
    var sig = list.map(function (r) {
      return r.sessionId + ':' + r.state + ':' + (r.sessionId === pinned ? 'p' : '');
    }).join('|') + '#' + String(overflow);
    if (sig === lastDotsSig) return;
    lastDotsSig = sig;
    box.textContent = '';
    list.forEach(function (row) {
      var dot = document.createElement('i');
      dot.dataset.s = row.state || 'off';
      if (row.sessionId === pinned) dot.dataset.pinned = '1';
      dot.setAttribute('role', 'button');
      dot.tabIndex = 0;
      // 读屏要说清这是哪个会话的什么状态，不能只念"按钮"
      dot.setAttribute('aria-label', (LABEL[row.state] || row.state) + ' · ' + String(row.sessionId).slice(0, 8)
        + (row.sessionId === pinned ? ' · 已钉住' : ''));
      dot.title = (LABEL[row.state] || row.state) + ' · ' + String(row.sessionId).slice(0, 8);
      function toggle() { pinSession(row.sessionId === pinned ? null : row.sessionId); }
      dot.addEventListener('click', toggle);
      dot.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
      });
      box.appendChild(dot);
    });
    if (overflow > 0) {
      var more = document.createElement('span');
      more.className = 'more';
      more.textContent = '+' + overflow;
      // 之前只是个 role=img 的静态文字，第 4+ 个会话在浮窗上根本点不到；
      // 若它正等你确认/出故障，等于被藏起来了。改成可点入口：弹会话切换菜单。
      more.setAttribute('role', 'button');
      more.tabIndex = 0;
      more.setAttribute('aria-label', '还有 ' + overflow + ' 个会话，点击选择');
      more.title = '更多会话';
      function openSessionMenu() {
        if (!host || typeof host.showSessionMenu !== 'function') return;
        host.showSessionMenu({
          sessions: all.map(function (r) { return { sessionId: r.sessionId, state: r.state }; }),
          pinned: pinned,
        });
      }
      more.addEventListener('click', openSessionMenu);
      more.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openSessionMenu(); }
      });
      box.appendChild(more);
    }
  }


  /* 钉住 / 放开。端口和 token 每次现取——宿主重启后它们都会变。 */
  function pinSession(sessionId) {
    if (!host) return;
    host.state().then(function (st) {
      if (!st || !st.endpoint) return;
      var url = 'http://127.0.0.1:' + st.endpoint.port + '/dsh-washer/pin?token='
        + encodeURIComponent(st.endpoint.token);
      fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId }),
      }).catch(function () { /* 宿主没起来就算了，下一帧覆盖 */ });
    });
  }

  /*
   * 状态边沿检测：只在**跳进** done/error 的那一刻通知一次。
   *
   * 不能按"当前是 done 就通知"——pushNow 每秒都会重推一次快照，
   * done 保持窗口有 6 秒，那样会连着弹六条。
   */
  var lastNotifiedState = null;
  /*
   * 卡住提醒单独用 turn 去重：卡住时状态不变（还是 washing/rinsing/spinning），
   * 光靠状态边沿检测不到。stalledMs 从 null 变成数字的那一刻才提醒，一轮一次。
   * 用 turn 而不是布尔，是为了下一轮真卡住时还能再提醒。
   */
  var lastStalledTurn = null;
  /* 等确认二次提醒：进入 waiting 后一直没人理，30s 再敲一次，别让唯一的提醒石沉大海。
     页面照发，main 会按 desktopOverlayNotify 拦——通知没开就不响。 */
  var WAITING_REMIND_MS = 30000;
  var waitingTimer = null;
  /* 其它会话（非当前显示那台）上次已知状态，用来做边沿检测。 */
  var lastOtherStates = {};
  function maybeNotify(snap) {
    var s = snap.state || 'off';
    var prev = lastNotifiedState;
    lastNotifiedState = s;
    if (prev !== s) {
      if (waitingTimer) { clearTimeout(waitingTimer); waitingTimer = null; }
      if (s === 'waiting' && prev !== null) {
        waitingTimer = setTimeout(function () {
          waitingTimer = null;
          if (lastNotifiedState === 'waiting' && host && typeof host.notify === 'function') {
            host.notify('waiting', '等你确认（还等着）');
          }
        }, WAITING_REMIND_MS);
      }
    }
    var stalled = typeof snap.stalledMs === 'number' && snap.stalledMs !== null;
    if (stalled && prev !== null && lastStalledTurn !== snap.turn) {
      lastStalledTurn = snap.turn;
      var stext = (snap.activeTool && snap.activeTool.action ? snap.activeTool.action + ' ' : '')
        + '好一会儿没动静';
      if (host && typeof host.notify === 'function') host.notify('stalled', stext);
      showFlash('stalled', stext);
    }
    /*
     * 其它会话也要叫人。之前只盯当前显示那个会话，后台跑完/卡住/等确认全被吞掉——
     * 用户开着三台 agent，却只有正在看的那台会响。
     * 其它会话只发系统通知、不弹窗口横幅（横幅属于当前显示的那台，乱弹会误导）。
     */
    var rows = Array.isArray(snap.sessions) ? snap.sessions : [];
    var seen = {};
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row || row.sessionId === snap.sessionId) continue;
      seen[row.sessionId] = true;
      var rs = row.state || 'off';
      var rp = lastOtherStates[row.sessionId];
      lastOtherStates[row.sessionId] = rs;
      if (rp === undefined || rp === rs) continue;      // 首次发现不吵
      if (rs !== 'done' && rs !== 'error' && rs !== 'waiting') continue;
      var rtext = String(row.sessionId).slice(0, 6) + ' · '
        + (rs === 'error' ? '罢工了' : rs === 'waiting' ? '该你啦' : '洗好啦');
      if (host && typeof host.notify === 'function') host.notify(rs, rtext);
    }
    for (var k in lastOtherStates) { if (!seen[k]) delete lastOtherStates[k]; }

    if (prev === null || prev === s) return;   // 首帧不通知，切到同一个状态也不通知
    /*
     * 三个要提醒的状态，中间的 starting/washing/rinsing/spinning/draining 全静音。
     *
     * 为什么不是"每个状态都响"：一次任务会依次经过五个状态，
     * 每个都响的话一轮下来响七八声，用户当天就会把开关关掉，
     * 然后真正重要的那声"洗完了"也跟着没了。
     * 只留三种**用户需要行动**的时刻：事情办完了、出事了、等你拍板。
     */
    if (s !== 'done' && s !== 'error' && s !== 'waiting') return;
    var text = s === 'error'
      ? ((snap.errorCode ? snap.errorCode + ' ' : '') + (ERR_HUMAN[snap.errorCode] || '工具没跑通'))
      : (s === 'waiting'
        ? '有个地方等你点一下'
        : ((typeof snap.toolCount === 'number' && snap.toolCount > 0 ? snap.toolCount + ' 件 · ' : '')
          + '用时 ' + (snap.durationText || '--:--')));
    if (host && typeof host.notify === 'function') host.notify(s, text);
    /*
     * 横幅和系统通知**同时**出，不是二选一。
     *
     * 页面这边没法知道 main 进程有没有真的把通知弹出来——
     * macOS 不给权限时失败是异步事件，IPC 是单向的。
     * 让两边的触发条件保持一致（都只看状态边沿），
     * 那边成功你就看到系统通知，失败你至少看到横幅；
     * 两边都成功时也不冲突：通知在屏幕角落，横幅在窗口里，一闪就没了。
     */
    showFlash(s, text);
  }

  /*
   * 本地完成横幅。
   *
   * 用淡入淡出而不是突然出现：浮窗只有 132px 宽，一个方块硬闪出来
   * 会把正在看的人吓一跳。1.8 秒够看清一行字，又不至于赖着不走。
   */
  var flashTimer = null;
  function showFlash(kind, text) {
    var box = el('flash');
    var t = el('flashT');
    var sub = el('flashS');
    if (!box || !t || !sub) return;
    if (document.body.dataset.size === 'tiny') return;  // 极简档没有位置放
    /*
     * 三种标题，不能再用「不是 error 就是洗完了」那条二分——
     * waiting 现在也走这里，落到 else 分支会显示成"洗完了"，
     * 明明是在等你确认，横幅却说洗完了，比不显示更误导。
     */
    t.textContent = kind === 'error' ? '咔哒…我罢工了'
      : kind === 'waiting' ? '喂——该你啦'
      : kind === 'stalled' ? '咕噜咕噜…转不动了'
      : '叮——洗好啦';
    sub.textContent = text;
    box.dataset.kind = kind === 'error' ? 'error'
      : kind === 'waiting' ? 'waiting'
      : kind === 'stalled' ? 'stalled'
      : 'done';
    // 贴机身上沿（resize 时 buildMachine 也会重算；这里兜底）
    var mh = Math.round(((window.innerWidth || 132) - 20) * (425 / 330));
    box.style.bottom = (mh + 14) + 'px';
    box.dataset.on = '1';
    if (flashTimer !== null) clearTimeout(flashTimer);
    // 停留时长随字数自适应：字多看得久，1.8s~3.2s
    var chars = (t.textContent || '').length + (text || '').length;
    var hold = Math.max(2200, Math.min(3200, 1800 + chars * 70));
    flashTimer = setTimeout(function () {
      box.dataset.on = '0';
      flashTimer = null;
    }, hold);
  }

  /*
   * 计时那一格显示什么。
   *
   * 宿主推过来两个相关的数：
   *   stalledMs —— 连续多久没有可见进展（null 表示没卡）
   *   durationText —— 本会话这一轮已运行多久
   *
   * 优先级：
   *   1. 卡住了先说卡住了——用户这时候真正想问的是"它是不是死了"，
   *      还在那报"已运行 3:20"等于没回答。
   *   2. 否则报已运行时长。
   *
   * 浮窗只有 132px 宽，所以这里只出一段字，不拼完整句子。
   */
  function fmtDur(ms) {
    var total = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(total / 60);
    var sec = total % 60;
    return String(m) + ':' + String(sec < 10 ? '0' + sec : sec);
  }

  /*
   * 计时格：卡住时长，或者已运行时长。
   *
   * 曾经还有一档 ETA（格式是 时间 + "之后完"）——宿主按本会话最近
   * 8 轮中位数估的。
   * 用户直接把这一档否掉了：「还要多久完成这个展示去掉，不准确」。
   * 估不准是结构性的：一轮跑多久取决于模型这一轮要调几次工具、每次多慢，
   * 历史中位数对这个几乎没预测力，给一个错的时间比不给更糟——用户会信它。
   * 主界面那边也一起去掉了，两边不能一个说一个不说。
   *
   * 卡住时长留着：那不是估算值，是"已经这么久没有新产出"的实测值。
   */
  function durationOf(s, snap) {
    if (typeof snap.stalledMs === 'number' && snap.stalledMs !== null) {
      return fmtDur(snap.stalledMs);
    }
    return snap.durationText || '--:--';
  }

  function render(snap) {
    var s = snap.state || 'off';
    var v = VISUAL[s] || VISUAL.idle;
    var prev = machine.dataset.state;

    /*
     * 故障时别再只写「故障」二字——用户看不到主界面的详情面板，
     * 光一个红灯加两个字，什么也判断不了。快照里的 errorCode 是
     * Host 端从 turn/end 的 reason 里翻译出来的（E-10 账号、E-30 上下文、
     * E-40 中断……），拼在状态文字后面，一眼就知道该干嘛。
     */
    var errCode = s === 'error' && snap.errorCode ? snap.errorCode : '';
    el('st').textContent = (LABEL[s] || s) + (errCode ? ' · ' + errCode : '');
    el('st').dataset.s = s;
    el('tm').textContent = durationOf(s, snap);
    renderDots(snap);
    maybeNotify(snap);

    paintLamp(s);
    buildMachine(snap);
    updatePanelTimer(snap);

    var load = (typeof snap.loadFactor === 'number' && snap.loadFactor > 0) ? Math.min(1, snap.loadFactor) : 0;

    machine.style.setProperty('--water', String(v.water));
    // 水花随负载变多：重活泡沫更旺。load 来自宿主按最近工具动作权重算的可解释值
    machine.style.setProperty('--foam', String(Math.min(1, v.foam + load * 0.25)));
    machine.style.setProperty('--led', String(v.led));
    // spin 是"每秒转多少圈"，换算成动画时长；0 就暂停在静止档。
    // 负载越重转得越快：读单个文件慢悠悠，批量重构/跑命令明显加速。
    var spinDur = v.spin > 0 ? (1 / (v.spin * (1 + load))).toFixed(2) + 's' : '0s';
    machine.style.setProperty('--spin-dur', spinDur);
    machine.style.setProperty('--spin-play', v.spin > 0 ? 'running' : 'paused');

    // 甩干抖得最厉害，洗涤时轻微抖——这是"在干活"的体感
    machine.dataset.shake = s === 'spinning' ? '2' : (s === 'washing' || s === 'draining' ? '1' : '0');
    machine.dataset.blink = v.blink > 0 ? (v.blink < 0.5 ? '2' : '1') : '0';

    // 状态落到 .machine 上，门外道具层靠它选表情（问号/闪电/星星/呼吸光）
    machine.dataset.state = s;

    /*
     * 切状态的"预备动作"。
     * 静态切换在任何屏幕上都会显得假——真实的东西动之前会先蓄一下。
     * 这里只在"真的换了状态"时打一次 one-shot 动画，避免每帧重放。
     * 重启 CSS 动画必须先删属性再强制 reflow，同一帧里连着设不会重播。
     */
    if (prev !== undefined && prev !== s && s !== 'off') {
      delete machine.dataset.pop;
      void machine.offsetWidth;
      machine.dataset.pop = '1';
      setTimeout(function () {
        delete machine.dataset.pop;
      }, 260);
    }
  }

  /*
   * 穿透的开关全在页面之外：设置页的「鼠标穿透」开关，以及 ⌥⌘W 全局快捷键。
   * 浮窗自己不再提供任何切换入口——右下角那颗亮蓝按钮已经删掉了，
   * 它是穿在机器身上的一块异物，而且穿透态本来就有整机半透明在提示。
   */
  if (host) {
    host.onClickThroughChange(function (on) {
      document.body.dataset.through = on ? '1' : '0';
    });
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      host.showMenu();
    });

  }

  /* 断线重连：宿主重启后端口和 token 都会变，所以每次都重新问主进程 */
  var retry = 0;
  var currentWs = null;
  var paused = false;
  function connect(port, token) {
    var ws;
    try { ws = new WebSocket('ws://127.0.0.1:' + port + '/dsh-washer/stream?token=' + encodeURIComponent(token)); }
    catch (e) { setConn('lost'); return; }
    currentWs = ws;
    ws.onopen = function () { setConn('open'); retry = 0; };
    ws.onmessage = function (ev) {
      try { lastSnap = JSON.parse(ev.data); render(lastSnap); } catch (e) { /* 脏帧忽略 */ }
    };
    ws.onclose = function () {
      if (currentWs === ws) currentWs = null;
      setConn('lost');
      // 暂停监听时主动断开，不再自动重连；取消暂停时 applyPrefs 会重新 connect
      if (paused) return;
      retry = Math.min(retry + 1, 5);
      setTimeout(reconnect, 500 * Math.pow(2, retry - 1));
    };
    ws.onerror = function () { setConn('lost'); };
  }
  function reconnect() {
    if (!host) return;
    host.state().then(function (st) {
      if (st && st.endpoint) connect(st.endpoint.port, st.endpoint.token);
      else setTimeout(reconnect, 2000);
    });
  }
  /* 尺寸档位与皮肤：主进程是唯一信源（它要按档位改窗口大小），
     页面只负责照着渲染。初始值从 state() 拿，之后靠 onPrefs 推送。 */
  var lastSnap = null;

  function applyPrefs(p) {
    if (p === null || typeof p !== 'object') return;
    var skinChanged = false;
    if (typeof p.size === 'string' && document.body.dataset.size !== p.size) {
      document.body.dataset.size = p.size;
      // 档位变了机器宽度也变，必须重建
      skinChanged = true;
    }
    if (typeof p.skin === 'string' && p.skin !== curSkin) {
      curSkin = p.skin;
      document.body.dataset.skin = p.skin;
      skinChanged = true;
    }
    // 主题：Web 端推来的明暗，落到 body[data-theme]，CSS 据此切浅/深。
    // 机器材质走 CSS 变量，不需要重建；换皮肤才要重建。
    if (typeof p.dark === 'boolean') {
      var nextTheme = p.dark ? 'dark' : 'light';
      if (document.body.dataset.theme !== nextTheme) {
        document.body.dataset.theme = nextTheme;
      }
    }
    if (typeof p.paused === 'boolean' && p.paused !== paused) {
      paused = p.paused;
      document.body.dataset.paused = paused ? '1' : '0';
      if (paused) {
        // 暂停监听：掐断 SSE/WS，画面冻结在最后一帧；主进程仍可随时恢复
        if (currentWs) { try { currentWs.close(); } catch (e) {} currentWs = null; }
      } else {
        reconnect();
      }
    }
    if (skinChanged) {
      curState = null;
      if (lastSnap !== null) { buildMachine(lastSnap); paintLamp(lastSnap.state || 'off'); }
    }
    /*
     * 这里原本有一行 reportCorner()——「可点的洞」那套做法删掉之后，
     * 主进程的 setCornerRect / preload 里的桥一起没了，只剩这个调用点。
     * 结果是每次切档位/皮肤都抛 ReferenceError，把 applyPrefs 后半段全部
     * 吞掉（现在它正好是最后一行所以看不出来，但之后再往下加逻辑就会静默失效）。
     * 窗口尺寸由主进程自己 setSize 管，页面不需要上报任何矩形。
     */
  }
  /*
   * 不可见就停动画（见样式表 html[data-hidden] 那段）。
   * 浮窗是常驻进程，切到别的 Space、被全屏应用盖住时都收不到别的信号，
   * 只有 visibilitychange 会告诉我们"现在没人看"。
   */
  function syncHidden() {
    document.documentElement.dataset.hidden = document.hidden ? '1' : '0';
  }
  document.addEventListener('visibilitychange', syncHidden);
  syncHidden();

  if (host) {
    host.state().then(function (st) {
      if (st) applyPrefs({ size: st.size, skin: st.skin, dark: st.dark, paused: st.paused, opacity: st.opacity });
    });
    host.onPrefs(applyPrefs);

    /*
     * 把系统的"减弱动态效果"告诉主进程。
     * 窗口尺寸的插值动画跑在主进程里，它读不到 CSS 媒体查询，
     * 只能由这边量一次再送过去，否则开了无障碍偏好还是会看到窗口缩放。
     */
    if (typeof host.setReduceMotion === 'function' && window.matchMedia) {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      host.setReduceMotion(mq.matches);
      mq.addEventListener('change', function (e) { host.setReduceMotion(e.matches); });
    }
  }

  /* ---------------- 彩蛋层：全部是纯视觉、只用已有快照信号 ----------------
     规则：只在待机/静息态触发，尊重 reduced-motion（CSS 媒体查询统一关动画），
     不新增任何宿主依赖。注意：连续失败徽章/奖牌已按用户要求移除。 */
  var IDLE_SHAKE_AFTER_MS = 60000;    // 待机满 1 分钟，开始偶尔轻轻晃一下
  var DOZE_AFTER_MS = 5 * 60 * 1000;  // 待机满 5 分钟，进入"打盹"（整机变暗）
  var idleSince = null;
  var nextShakeAt = 0;
  function eggTick() {
    var snap = lastSnap;
    if (!snap) return;
    var s = snap.state || 'off';
    var now = Date.now();
    if (s === 'idle') { if (idleSince === null) idleSince = now; }
    else { idleSince = null; nextShakeAt = 0; }
    var dozing = idleSince !== null && (now - idleSince) >= DOZE_AFTER_MS;
    document.body.dataset.doze = dozing ? '1' : '0';
    // 空闲轻抖：待机够久后，隔 20~40s 轻轻晃一下（打盹时不晃）
    if (idleSince !== null && !dozing) {
      if (nextShakeAt === 0) nextShakeAt = idleSince + IDLE_SHAKE_AFTER_MS;
      if (now >= nextShakeAt) {
        nextShakeAt = now + 20000 + Math.random() * 20000;
        machine.dataset.idleShake = '1';
        setTimeout(function () { delete machine.dataset.idleShake; }, 650);
      }
    }
  }
  setInterval(eggTick, 1000);

  if (host) reconnect();
})();
</script>
</body>
</html>

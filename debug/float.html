<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:*;">
<title>dsh-washer</title>
<style>
  /*
   * 透明窗口里的悬浮洗衣机。
   * 整个页面背景透明，只有机器和气泡有底色——没有大卡片边框，
   * 机器就像真的摆在桌面上。
   */
  :root {
    color-scheme: dark;
    --bubble: rgba(20, 22, 28, .90);
    --text: #e8eaee;
    --dim: #8b929e;
    --ok: #2ee06a;
    --warn: #f5b93a;
    --bad: #e5484d;
    --run: #3aa0ff;
    /*
     * 切档动画的时长和曲线。曲线必须和主进程 animateBounds 的
     * smoothstep（3t²-2t³）对齐——原来是 .32,.72,0,1，起点斜率很大，
     * 一上来就冲出去，和窗口那边先慢后快的节奏互相打架，
     * 两边内容在同一帧里各走各的，看着就是卡。
     * .32,0,.68,1 是 CSS 里的 ease-in-out，形状和 smoothstep 基本一致。
     */
    --size-dur: 220ms;
    --size-ease: cubic-bezier(.32, 0, .68, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    cursor: default;
  }
  /*
   * 禁选中必须放在具体元素上，不能放 html/body。
   * 在 html/body 上写 user-select: none 会让整页的 -webkit-app-region: drag
   * 一起失效 —— Electron 的已知行为，表现为"拖拽区明明在，就是拖不动"。
   */
  .machine, .bubble { -webkit-user-select: none; user-select: none; }

  .wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    /*
     * 尺寸档位切换的过渡。
     *
     * 原来 .wrap / .machine / .bubble 全都是"属性一改，下一帧就到位"，
     * 而主进程那边是直接 setBounds 改窗口大小——两头都是硬切，
     * 用户看到的就是"像卡顿"。这里补上过渡，和主进程的窗口动画同频率，
     * 内容是"边缩边挪"而不是先缩完再等着窗口变大。
     */
    transition: width var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
  }

  /* ---- 洗衣机 ---- */
  .machine {
    position: relative;
    /* 整机都是拖拽区（见 .grab） */
    width: 100%;
    display: flex;
    justify-content: center;
    /* 极简/正常切换时机器本体跟着缩，不是瞬间跳变 */
    transition: width var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
  }
  /* 甩干时整台机器会抖，这是它看起来"在工作"的关键 */
  .machine[data-shake="1"] { animation: shake .18s steps(2, end) infinite; }
  .machine[data-shake="2"] { animation: shake .09s steps(2, end) infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(1px, -1px); }
    100% { transform: translate(0, 1px); }
  }

  svg { display: block; image-rendering: pixelated; }
  /* 64x78 的像素画，按 1.75 倍放大到 112x136——整数倍会糊，非整数倍才锐 */
  .washer { width: 112px; height: 136px; }

  /*
   * 拖拽区：整台机器都能拖。
   *
   * 早期只给机器顶部一条 26px 高的带子，因为整机设 drag 会吞掉 dblclick
   * 和右键菜单。现在双击穿透的入口已经挪到设置页（用户要求整机可拖），
   * 拖拽区就可以铺满整个机器本体了——抓着机器上任何地方都能搬。
   *
   * 右键菜单不受影响：它是 document 级的 contextmenu 监听，
   * 而且 .wrap 本身是 no-drag。
   */
  .grab {
    /* 绝对定位会排在 SVG 之后、被 SVG 盖住，必须显式提层，
       否则鼠标点到的是 SVG，拖拽区收不到事件——实测就是这样失效的 */
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    app-region: drag;
    -webkit-app-region: drag;
    cursor: grab;
  }
  .grab:active { cursor: grabbing; }
  /* 拖拽区下面那层必须 no-drag，否则右键菜单落不到机器上 */
  .bubble { -webkit-app-region: no-drag; }

  /*
   * 水位 / 泡沫 / 指示灯的颜色不再在这里定义 —— 它们和主界面是同一段 CSS
   * （style.css 的 .dw-px 段落），由 build-float.mjs 打包进造型样式表。
   * 这里只剩像素滚筒的转动：它只属于浮窗，主界面那个 32px sprite 转不转无所谓。
   */
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .3; } }

  /* 滚筒转动：绕玻璃圆心转 */
  .px-wheel {
    transform-origin: 31px 43px;
    animation: spin var(--spin-dur, 2.4s) linear infinite;
    animation-play-state: var(--spin-play, paused);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 气泡：状态 + 计时 ---- */
  .bubble {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bubble);
    color: var(--text);
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    /* 气泡进出场：极简态要塌缩，所以 max-height/padding 一起过渡 */
    transition: opacity var(--size-dur, 220ms) ease,
                max-height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                padding var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                margin var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
    max-height: 30px;
  }
  .bubble .st { font-weight: 600; }
  .bubble .st[data-s="idle"], .bubble .st[data-s="off"] { color: var(--dim); }
  .bubble .st[data-s="starting"], .bubble .st[data-s="washing"],
  .bubble .st[data-s="rinsing"], .bubble .st[data-s="spinning"],
  .bubble .st[data-s="draining"] { color: var(--run); }
  .bubble .st[data-s="waiting"] { color: var(--warn); }
  .bubble .st[data-s="done"] { color: var(--ok); }
  .bubble .st[data-s="error"] { color: var(--bad); }
  .bubble .tm { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* 没连上时气泡换成提示，机器保持暗淡 */
  .bubble[data-off="1"] { color: var(--dim); }
  .wrap[data-conn="lost"] .bubble { color: var(--bad); }

  /* ---- 穿透态 ---- */
  /*
   * 穿透时整机半透明，提示"现在点不到我"。
   * 以前右下角还挂一个亮蓝色按钮当退出通道，现在退出走两个地方：
   * 设置页的开关、⌥⌘W 全局快捷键——按钮就没必要了，而且是穿进机器里的一块异物。
   */
  body[data-through="1"] .machine,
  body[data-through="1"] .bubble { opacity: .42; }

  /* ---------- 尺寸档位 ---------- */
  /* 正常态：132x200，机器 + 气泡 */
  body[data-size="normal"] .wrap { width: 132px; height: 200px; }
  /* 极简态：76x96，只剩机器和角上的指示灯，气泡整个不占位 */
  body[data-size="tiny"] .wrap { width: 76px; height: 96px; }
  body[data-size="tiny"] .washer { width: 64px; height: 78px; }
  /*
     极简态气泡不占位。但不能直接 display:none —— 那样没有过渡，
     气泡会"啪"地消失。改成高度塌缩 + 透明，结束再真正隐藏。
   */
  body[data-size="tiny"] .bubble {
    opacity: 0;
    max-height: 0;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }
  /* 极简态没有气泡，状态全靠机器自己的指示灯表达，给它加点辉光 */


  /* ---------- 状态灯 ---------- */
  /*
   * 以前浮窗在机器右上角外挂了一颗独立的圆灯。问题是三套造型本来就
   * 各自带着自己的指示灯——像素是机身上的 .px-led、精密家电是面板上的
   * .led、动漫是液晶屏那道发光条——再挂一颗悬在最外层的灯，
   * 怎么看都是贴在机器身上的异物，而不是机器的一部分。
   *
   * 现在只用造型自带的灯：把状态色注入 --led，由各造型的 CSS 自己消化。
   * 那套皮肤本来就在主界面 dock 里正常工作，浮窗复用同一份样式表，
   * 所以不需要第二套灯光逻辑。
   */
  .machine { position: relative; }
  /* 等待确认和故障要闪，其余状态常亮——闪是"需要人看一眼"的信号 */
  /* 闪烁由各造型自己的 [data-blink] 规则驱动，这里不重复写 */
  body[data-size="tiny"] .dw-px .px-led { filter: drop-shadow(0 0 4px var(--dw-led, #7c8896)); }
  body[data-size="tiny"] .dw-pw .led { filter: drop-shadow(0 0 4px var(--dw-sig-run)); }

  /* ---------- 造型选择 ---------- */
  /* 三套造型由 float.machines.js 生成 DOM 和 CSS，这里只管摆放。
     方案 B：窗口固定宽度，三套造型都缩放到同一宽度，
     所以外层 .machine 的尺寸在三套之间保持一致，切换时不跳。 */
  /*
   * transform-origin 必须是 0 0。
   * 默认锚点在元素中心，scale(0.34) 会把内容往四周收缩的同时把左上角
   * 推到 (70%,70%) 的位置——机器就整个跑到窗口右下角外面去了。
   *
   * 选择器不能写成 .machine > .dw-frame-inner：中间隔着 skinHost 这一层。
   */
  .machine .dw-frame { display: block; position: relative; }
  .machine .dw-frame .dw-frame-inner { transform-origin: 0 0; }
  /* 精密家电和动漫造型靠自带的 transition 表达水位，像素图靠 --water */
  body[data-size="tiny"] .machine > .dw-frame { transform-origin: top left; }

  /* ---------- 主题：跟随宿主 GUI（dock 同款明暗） ---------- */
  /*
   * Web 端把宿主 documentElement 是否带 data-ds-dark-theme 量出来，
   * 经 /dsh-washer/prefs 送到主进程，再推给这里，落到 body[data-theme]。
   * - light：白底气泡、深字，机器用亮色材质（--dw-* 默认值本身就是亮色）。
   * - dark ：深底气泡、浅字，机器换成暗色材质（下面这段覆盖 --dw-*）。
   * 机器材质的暗色值直接搬主界面 [data-ds-dark-theme] 那套，保证两边同款。
   */
  body[data-theme="light"] {
    color-scheme: light;
    --bubble: rgba(255, 255, 255, .92);
    --text: #1b2430;
    --dim: #6b7684;
  }
  body[data-theme="light"] .bubble {
    box-shadow: 0 2px 8px rgba(20, 40, 70, .14), 0 0 0 .5px rgba(0, 0, 0, .06);
  }
  body[data-theme="dark"] .washerskin,
  body:not([data-theme="light"]) .washerskin {
    --dw-body-1: #4c5762;
    --dw-body-2: #39434e;
    --dw-body-3: #28313a;
    --dw-body-4: #1b2229;
    --dw-body-edge: rgba(255, 255, 255, 0.16);
    --dw-body-shade: rgba(0, 0, 0, 0.55);
    --dw-chrome-1: #b9c4cf;
    --dw-chrome-2: #6b7885;
    --dw-chrome-3: #3a444f;
    --dw-chrome-4: #8b98a5;
    --dw-glass-1: rgba(120, 180, 215, 0.55);
    --dw-glass-2: rgba(46, 96, 130, 0.6);
    --dw-glass-3: rgba(14, 38, 58, 0.9);
    --dw-glass-4: rgba(4, 12, 20, 0.97);
    --dw-water-1: #6fc3e6;
    --dw-water-2: #2b7ea8;
    --dw-water-3: #17546f;
    --dw-sig-run: #4aa3f0;
    --dw-sig-wait: #f0b73a;
    --dw-sig-err: #f26064;
    --dw-sig-ok: #3fbf7a;
    --dw-sig-off: #4c5762;
  }
  /* 动漫造型的机身是写死的浅色，暗色下压暗一点，别在深桌面上白得刺眼 */
  body[data-theme="dark"] .dw-aw-body,
  body:not([data-theme="light"]) .dw-aw-body {
    background: linear-gradient(172deg, #3d4650 0%, #333b45 52%, #262d35 100%);
  }

</style>
</head>
<body data-size="normal" data-skin="precision" data-theme="dark">
<div class="wrap" id="wrap" data-conn="idle">
  <div class="machine" id="machine" data-blink="0" data-shake="0"
       style="--water:7;--foam:0;--led:#7c8896;--spin-dur:0s;--spin-play:paused">
    <div class="grab" id="grab"></div>
    <div class="skin-host washerskin" id="skinHost"></div>
  </div>
  <div class="bubble" id="bubble">
    <span class="st" id="st" data-s="off">未连接</span>
    <span class="tm" id="tm">--:--</span>
  </div>
</div>

<script src="./float.machines.js"></script>
<script>
(function () {
  var LABEL = {
    off: '未连接', idle: '待机', starting: '启动中', washing: '洗涤中',
    rinsing: '漂洗中', spinning: '脱水中', waiting: '等你确认',
    draining: '排水换水', done: '洗完了', error: '故障',
  };
  // 和 src/core.js 的 VISUAL 一一对应；这里只保留悬浮窗用得到的四个量
  var VISUAL = {"off":{"water":7,"foam":0,"led":"#4a5560","blink":0,"spin":0},"idle":{"water":6.5,"foam":0,"led":"#7c8896","blink":0,"spin":0},"starting":{"water":3.5,"foam":0.3,"led":"#3aa0ff","blink":0,"spin":5},"washing":{"water":0.5,"foam":1,"led":"#3aa0ff","blink":0,"spin":2.4},"rinsing":{"water":0.5,"foam":0.6,"led":"#3aa0ff","blink":0,"spin":2.4},"spinning":{"water":4,"foam":0,"led":"#3aa0ff","blink":0,"spin":0.6},"waiting":{"water":4.5,"foam":0.2,"led":"#f5b93a","blink":0.6,"spin":0},"draining":{"water":7,"foam":0,"led":"#1f9aa8","blink":0,"spin":5},"done":{"water":6.5,"foam":0,"led":"#2ee06a","blink":0,"spin":0},"error":{"water":5,"foam":0,"led":"#e5484d","blink":0.35,"spin":0}};

  var el = function (id) { return document.getElementById(id); };
  var host = window.washerHost || null;
  var machine = el('machine');

  function setConn(kind) {
    el('wrap').dataset.conn = kind;
  }

  /*
   * 当前造型与上次渲染的状态。机械造型重建有成本（精密家电有几十个节点），
   * 所以只在造型或状态真的变了才重建——每秒一次的计时刷新不该重画整台机器。
   */
  var curSkin = 'precision';
  var curState = null;

  /**
   * 状态灯：浮窗自己的，不是像素图里那个。
   *
   * 像素图里的 LED 是 10×10 的像素细节，缩放到 112px 宽后只有十来个屏幕像素，
   * 红蓝绿在上面根本分不出来。浮窗要承担"状态播报"的职责，所以单独给一个
   * 够大、带光晕的圆点——这不是重复，是把信息从细节里解放出来。
   */
  /*
   * 状态色写进机器容器，由造型自己的灯去消化（见上面「状态灯」那段注释）。
   * 以前这里操作的是外挂的 .lamp 元素，那颗灯已经删了。
   */
  function paintLamp(s) {
    var machine = el('machine');
    if (machine === null) return;
    var v = VISUAL[s] || VISUAL.idle;
    machine.style.setProperty('--led', v.led);
  }

  function buildMachine(snap) {
    var s = snap.state || 'off';
    if (s === curState && el('skinHost').firstChild !== null) return;
    curState = s;
    var hostNode = el('skinHost');
    var width = 112;
    // 极简态机器小一圈，保持窗口比例
    if (document.body.dataset.size === 'tiny') width = 64;
    hostNode.textContent = '';
    // --dw-* 变量挂在 .washerskin 上，[data-state] 的状态色绑定也靠这个容器，
    // 忘了同步就会用上一轮的状态配色（灯红了机器还蓝着）
    hostNode.setAttribute('data-state', s);
    if (window.WasherMachines) {
      hostNode.appendChild(window.WasherMachines.build(
        curSkin, s, width, snap.durationText || '--:--', snap.state === 'waiting'));
    }
    curState = s;
  }

  function render(snap) {
    var s = snap.state || 'off';
    var v = VISUAL[s] || VISUAL.idle;

    el('st').textContent = LABEL[s] || s;
    el('st').dataset.s = s;
    el('tm').textContent = snap.durationText || '--:--';

    paintLamp(s);
    buildMachine(snap);

    machine.style.setProperty('--water', String(v.water));
    machine.style.setProperty('--foam', String(v.foam));
    machine.style.setProperty('--led', String(v.led));
    // spin 是"每秒转多少圈"，换算成动画时长；0 就暂停在静止档
    var spinDur = v.spin > 0 ? (1 / v.spin).toFixed(2) + 's' : '0s';
    machine.style.setProperty('--spin-dur', spinDur);
    machine.style.setProperty('--spin-play', v.spin > 0 ? 'running' : 'paused');

    // 甩干抖得最厉害，洗涤时轻微抖——这是"在干活"的体感
    machine.dataset.shake = s === 'spinning' ? '2' : (s === 'washing' || s === 'draining' ? '1' : '0');
    machine.dataset.blink = v.blink > 0 ? (v.blink < 0.5 ? '2' : '1') : '0';
  }

  /*
   * 穿透的开关全在页面之外：设置页的「鼠标穿透」开关，以及 ⌥⌘W 全局快捷键。
   * 浮窗自己不再提供任何切换入口——右下角那颗亮蓝按钮已经删掉了，
   * 它是穿在机器身上的一块异物，而且穿透态本来就有整机半透明在提示。
   */
  if (host) {
    host.onClickThroughChange(function (on) {
      document.body.dataset.through = on ? '1' : '0';
    });
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      host.showMenu();
    });

  }

  /* 断线重连：宿主重启后端口和 token 都会变，所以每次都重新问主进程 */
  var retry = 0;
  function connect(port, token) {
    var ws;
    try { ws = new WebSocket('ws://127.0.0.1:' + port + '/dsh-washer/stream?token=' + encodeURIComponent(token)); }
    catch (e) { setConn('lost'); return; }
    ws.onopen = function () { setConn('open'); retry = 0; };
    ws.onmessage = function (ev) {
      try { lastSnap = JSON.parse(ev.data); render(lastSnap); } catch (e) { /* 脏帧忽略 */ }
    };
    ws.onclose = function () {
      setConn('lost');
      retry = Math.min(retry + 1, 5);
      setTimeout(reconnect, 500 * Math.pow(2, retry - 1));
    };
    ws.onerror = function () { setConn('lost'); };
  }
  function reconnect() {
    if (!host) return;
    host.state().then(function (st) {
      if (st && st.endpoint) connect(st.endpoint.port, st.endpoint.token);
      else setTimeout(reconnect, 2000);
    });
  }
  /* 尺寸档位与皮肤：主进程是唯一信源（它要按档位改窗口大小），
     页面只负责照着渲染。初始值从 state() 拿，之后靠 onPrefs 推送。 */
  var lastSnap = null;

  function applyPrefs(p) {
    if (p === null || typeof p !== 'object') return;
    var skinChanged = false;
    if (typeof p.size === 'string' && document.body.dataset.size !== p.size) {
      document.body.dataset.size = p.size;
      // 档位变了机器宽度也变，必须重建
      skinChanged = true;
    }
    if (typeof p.skin === 'string' && p.skin !== curSkin) {
      curSkin = p.skin;
      document.body.dataset.skin = p.skin;
      skinChanged = true;
    }
    // 主题：Web 端推来的明暗，落到 body[data-theme]，CSS 据此切浅/深。
    // 机器材质走 CSS 变量，不需要重建；换皮肤才要重建。
    if (typeof p.dark === 'boolean') {
      var nextTheme = p.dark ? 'dark' : 'light';
      if (document.body.dataset.theme !== nextTheme) {
        document.body.dataset.theme = nextTheme;
      }
    }
    if (skinChanged) {
      curState = null;
      if (lastSnap !== null) { buildMachine(lastSnap); paintLamp(lastSnap.state || 'off'); }
    }
    // 档位变了窗口尺寸也变了，角落矩形得重新上报
    reportCorner();
  }
  if (host) {
    host.state().then(function (st) {
      if (st) applyPrefs({ size: st.size, skin: st.skin, dark: st.dark });
    });
    host.onPrefs(applyPrefs);

    /*
     * 把系统的"减弱动态效果"告诉主进程。
     * 窗口尺寸的插值动画跑在主进程里，它读不到 CSS 媒体查询，
     * 只能由这边量一次再送过去，否则开了无障碍偏好还是会看到窗口缩放。
     */
    if (typeof host.setReduceMotion === 'function' && window.matchMedia) {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      host.setReduceMotion(mq.matches);
      mq.addEventListener('change', function (e) { host.setReduceMotion(e.matches); });
    }
  }

  if (host) reconnect();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:*;">
<title>dsh-washer</title>
<style>
  /*
   * 透明窗口里的悬浮洗衣机。
   * 整个页面背景透明，只有机器和气泡有底色——没有大卡片边框，
   * 机器就像真的摆在桌面上。
   */
  :root {
    color-scheme: dark;
    --bubble: rgba(20, 22, 28, .90);
    --text: #e8eaee;
    --dim: #8b929e;
    --ok: #2ee06a;
    --warn: #f5b93a;
    --bad: #e5484d;
    --run: #3aa0ff;
    /*
     * 切档动画的时长和曲线。曲线必须和主进程 animateBounds 的
     * smoothstep（3t²-2t³）对齐——原来是 .32,.72,0,1，起点斜率很大，
     * 一上来就冲出去，和窗口那边先慢后快的节奏互相打架，
     * 两边内容在同一帧里各走各的，看着就是卡。
     * .32,0,.68,1 是 CSS 里的 ease-in-out，形状和 smoothstep 基本一致。
     */
    --size-dur: 220ms;
    --size-ease: cubic-bezier(.32, 0, .68, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    cursor: default;
  }
  /*
   * 禁选中必须放在具体元素上，不能放 html/body。
   * 在 html/body 上写 user-select: none 会让整页的 -webkit-app-region: drag
   * 一起失效 —— Electron 的已知行为，表现为"拖拽区明明在，就是拖不动"。
   */
  .machine, .bubble { -webkit-user-select: none; user-select: none; }

  .wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    /*
     * 尺寸档位切换的过渡。
     *
     * 原来 .wrap / .machine / .bubble 全都是"属性一改，下一帧就到位"，
     * 而主进程那边是直接 setBounds 改窗口大小——两头都是硬切，
     * 用户看到的就是"像卡顿"。这里补上过渡，和主进程的窗口动画同频率，
     * 内容是"边缩边挪"而不是先缩完再等着窗口变大。
     */
    transition: width var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
  }

  /* ---- 洗衣机 ---- */
  .machine {
    position: relative;
    /* 整机都是拖拽区（见 .grab） */
    width: 100%;
    display: flex;
    justify-content: center;
    /* 极简/正常切换时机器本体跟着缩，不是瞬间跳变 */
    transition: width var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
  }
  /* 甩干时整台机器会抖，这是它看起来"在工作"的关键 */
  .machine[data-shake="1"] { animation: shake .18s steps(2, end) infinite; }
  .machine[data-shake="2"] { animation: shake .09s steps(2, end) infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(1px, -1px); }
    100% { transform: translate(0, 1px); }
  }
  /*
   * 切状态的预备动作：极短的一次"吸气"。
   *
   * 为什么不缩整机：.machine 是撑满窗口宽度的 flex 容器，scale 会以中心为
   * 原点外扩——机身往上顶出窗口、往下压住气泡，而窗口是透明紧贴内容的，
   * 顶出去的部分直接被裁掉，看起来像"机器跳了一下"。
   * 改成只给机身（.skin-host）做缩放，transform-origin 钉在底部中心，
   * 像真机器那样"沉一下"，不会碰到气泡。
   *
   * 也不能复用 .machine 上的 transform：data-shake 已经在上面跑无限循环，
   * 两个 animation 抢同一个属性，后声明的直接覆盖前者——甩干时抖着抖着
   * 就停了。所以 pop 挂在子元素上，两套动画互不干扰。
   */
  .machine[data-pop="1"] > .skin-host { animation: pop .24s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop {
    0%   { transform: scale(1) translateY(0); }
    35%  { transform: scale(1.045) translateY(1px); }
    100% { transform: scale(1) translateY(0); }
  }
  .machine > .skin-host { transform-origin: 50% 100%; }

  svg { display: block; image-rendering: pixelated; }  /* 64x78 的像素画，按 1.75 倍放大到 112x136——整数倍会糊，非整数倍才锐 */
  .washer { width: 112px; height: 136px; }

  /*
   * 拖拽区：整台机器都能拖。
   *
   * 早期只给机器顶部一条 26px 高的带子，因为整机设 drag 会吞掉 dblclick
   * 和右键菜单。现在双击穿透的入口已经挪到设置页（用户要求整机可拖），
   * 拖拽区就可以铺满整个机器本体了——抓着机器上任何地方都能搬。
   *
   * 右键菜单不受影响：它是 document 级的 contextmenu 监听，
   * 而且 .wrap 本身是 no-drag。
   */
  .grab {
    /* 绝对定位会排在 SVG 之后、被 SVG 盖住，必须显式提层，
       否则鼠标点到的是 SVG，拖拽区收不到事件——实测就是这样失效的 */
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    app-region: drag;
    -webkit-app-region: drag;
    cursor: grab;
  }
  .grab:active { cursor: grabbing; }
  /* 拖拽区下面那层必须 no-drag，否则右键菜单落不到机器上 */
  .bubble { -webkit-app-region: no-drag; }

  /*
   * 水位 / 泡沫 / 指示灯的颜色不再在这里定义 —— 它们和主界面是同一段 CSS
   * （style.css 的 .dw-px 段落），由 build-float.mjs 打包进造型样式表。
   * 这里只剩像素滚筒的转动：它只属于浮窗，主界面那个 32px sprite 转不转无所谓。
   */
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .3; } }

  /* 滚筒转动：绕玻璃圆心转 */
  .px-wheel {
    transform-origin: 31px 43px;
    animation: spin var(--spin-dur, 2.4s) linear infinite;
    animation-play-state: var(--spin-play, paused);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 气泡：状态 + 计时 ---- */
  .bubble {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bubble);
    color: var(--text);
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    /* 气泡进出场：极简态要塌缩，所以 max-height/padding 一起过渡 */
    transition: opacity var(--size-dur, 220ms) ease,
                max-height var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                padding var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1)),
                margin var(--size-dur, 220ms) var(--size-ease, cubic-bezier(.32, 0, .68, 1));
    max-height: 30px;
  }
  .bubble .st { font-weight: 600; }
  .bubble .st[data-s="idle"], .bubble .st[data-s="off"] { color: var(--dim); }
  .bubble .st[data-s="starting"], .bubble .st[data-s="washing"],
  .bubble .st[data-s="rinsing"], .bubble .st[data-s="spinning"],
  .bubble .st[data-s="draining"] { color: var(--run); }
  .bubble .st[data-s="waiting"] { color: var(--warn); }
  .bubble .st[data-s="done"] { color: var(--ok); }
  .bubble .st[data-s="error"] { color: var(--bad); }
  .bubble .tm { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* 没连上时气泡换成提示，机器保持暗淡 */
  .bubble[data-off="1"] { color: var(--dim); }
  .wrap[data-conn="lost"] .bubble { color: var(--bad); }

  /* ---- 穿透态 ---- */
  /*
   * 穿透时整机半透明，提示"现在点不到我"。
   * 以前右下角还挂一个亮蓝色按钮当退出通道，现在退出走两个地方：
   * 设置页的开关、⌥⌘W 全局快捷键——按钮就没必要了，而且是穿进机器里的一块异物。
   */
  body[data-through="1"] .machine,
  body[data-through="1"] .bubble { opacity: .42; }

  /* ---------- 门外道具层 ---------- */
  /*
   * 视频里那套"动画语法"的关键不在滚筒转多快，而在机身之外的反应：
   * 等人时头顶飘一个问号、故障时一道闪电、洗完亮三颗星。
   * 我们的表达原来全缩在机身里 + 一颗 7px 小灯，所以机器在动但没情绪。
   *
   * 实现约束（踩过就知道）：
   * - 必须 pointer-events:none。.grab 是整机拖拽区，道具层压在它上面会
   *   把拖拽吃掉，表现为"机器突然拖不动了"。
   * - 只能动 transform / opacity。透明置顶窗口里动 width/left 会每帧重排，
   *   功耗直接翻倍，笔记本上很明显。
   * - 道具层贴在机器上沿之上，不占布局（position:absolute），
   *   否则窗口内容会变高，把气泡顶出可见区。
   */
  .props {
    /*
     * 道具层压在机身顶部那一条上（bottom:100% 即机器上沿）。
     * 高度 22px 而不是 34px：窗口只有 200px 高，机器 136 + 气泡约 24，
     * 上方只剩约 40px 余量，再高就顶到窗口边缘被裁掉。
     * 每个道具各自用 bottom 精确定位，不用 flex 对齐——三个道具形状不同，
     * flex-end 会让它们按各自盒模型贴底，看起来高低不齐。
     */
    /*
     * bottom: calc(100% + 2px)：留 2px 呼吸缝。
     * 贴死 100% 时，道具层最低那 6px 会被机器的圆角/描边压住——
     * 待机呼吸光和星星底座正好卡在那儿，看起来像被削掉半截。
     */
    position: absolute;
    left: 0; right: 0; bottom: calc(100% + 2px);
    height: 20px;
    pointer-events: none;
    z-index: 20;
  }
  /*
   * 居中的做法很关键：所有道具都用 left: calc(50% - 半宽) 而非
   * left:50% + transform:translateX(-50%)。
   *
   * 因为问号/闪电/呼吸光各自都有 transform 动画（pop-in / hover / twitch /
   * glow-breathe），keyframes 里的 transform 会整个替换掉元素上的
   * transform 值——translateX(-50%) 一旦被覆盖，道具会当场右跳半个宽度，
   * 动画结束又跳回来，看着就是"抖了一下"。
   * 用 left 做居中，transform 就能完全留给动画自由使用。
   */
  .props > * {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
  }

  /* 等待确认：头顶一个问号，慢慢上下浮，门缝透出暖光 */
  .props .p-q {
    font: 700 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--warn);
    text-shadow: 0 0 8px rgba(245, 185, 58, .75);
    bottom: 1px;
    left: calc(50% - 4px);   /* 问号字面偏左，用 -4px 让视觉重心落在中线上 */
  }
  .machine[data-state="waiting"] .props .p-q {
    animation: pop-in .28s cubic-bezier(.34, 1.56, .64, 1) both,
               hover 2.2s ease-in-out .28s infinite;
  }
  .machine[data-state="waiting"] .door,
  .machine[data-state="waiting"] .dw-pw .door {
    filter: drop-shadow(0 0 6px rgba(245, 185, 58, .55));
  }

  /* 故障：一道闪电，高频短促地抽动一下再停 */
  .props .p-bolt {
    font: 700 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--bad);
    text-shadow: 0 0 9px rgba(229, 72, 77, .8);
    bottom: 0;
    left: calc(50% - 8px);   /* ⚡ 字形更宽，半宽约 8px */
  }
  .machine[data-state="error"] .props .p-bolt {
    animation: pop-in .18s ease-out both,
               twitch .72s steps(1, end) .18s infinite;
  }

  /* 洗完了：三颗星依次亮起，然后一起淡下去（只演一轮，不吵） */
  .props .p-stars { display: flex; gap: 3px; bottom: 3px; left: calc(50% - 10.5px); }  /* 3*5px + 2*3px = 21px，半宽 10.5 */
  /*
   * 星星的居中同样只靠 left 算出来（21px 宽），容器本身不带 transform，
   * 这样每颗星的 star-pop 可以放心用 scale。若改成 translateX(-50%)，
   * 子元素的 scale 不会波及父级，但父级一旦被 keyframes 写 transform
   * 居中就会失效——保持容器无 transform 是最省心的写法。
   */
  .props .p-stars i {
    width: 5px; height: 5px;
    background: var(--ok);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    box-shadow: 0 0 5px var(--ok);
  }
  .machine[data-state="done"] .props .p-stars {
    animation: stars-run 3.2s ease-out both;
  }
  .machine[data-state="done"] .props .p-stars i:nth-child(1) { animation: star-pop .34s ease-out both; }
  .machine[data-state="done"] .props .p-stars i:nth-child(2) { animation: star-pop .34s .12s ease-out both; }
  .machine[data-state="done"] .props .p-stars i:nth-child(3) { animation: star-pop .34s .24s ease-out both; }

  /* 待机：一团缓慢呼吸的冷光，安静但不死 */
  .props .p-glow {
    bottom: 5px; width: 26px; height: 8px; left: calc(50% - 13px); border-radius: 50%;
    /*
     * 呼吸光要"看得见但不抢戏"。
     * 初版透明度 .55 再叠 blur(2px)，在深色桌面上等于消失——
     * 截图里只剩一道灰雾，跟没加一样。
     * 提亮到 .8、去掉 blur（blur 会把它摊成一团平均色，反而更看不见），
     * 改用两层径向渐变做出中间实、边缘虚的灯罩感。
     */
    background:
      radial-gradient(ellipse at 50% 50%, rgba(150, 210, 255, .8), rgba(120, 180, 235, .25) 55%, transparent 76%);
  }
  .machine[data-state="idle"] .props .p-glow { animation: glow-breathe 5.5s ease-in-out infinite; }
  .machine[data-state="off"] .props > * { animation: none; opacity: 0; }

  /*
   * 极简态（64px 机器）里道具会挤成一坨糊，整层关掉——
   * 那个档位的定位本来就是"只剩指示灯"。
   */
  body[data-size="tiny"] .props { display: none; }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(.4) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes hover {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes twitch {
    0%, 42%, 100% { transform: translateX(0); }
    43%, 51%      { transform: translateX(-2px); }
    47%, 55%      { transform: translateX(2px); }
  }
  @keyframes star-pop {
    from { opacity: 0; transform: scale(.2); }
    60%  { opacity: 1; transform: scale(1.25); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes stars-run {
    0%, 62% { opacity: 1; }
    100%    { opacity: .34; }
  }
  @keyframes glow-breathe {
    0%, 100% { opacity: .18; transform: scale(.86); }
    50%      { opacity: .5;  transform: scale(1.06); }
  }

  /* ---------- 尺寸档位 ---------- */
  /* 正常态：132x200，机器 + 气泡 */
  body[data-size="normal"] .wrap { width: 132px; height: 200px; }
  /* 极简态：76x96，只剩机器和角上的指示灯，气泡整个不占位 */
  body[data-size="tiny"] .wrap { width: 76px; height: 96px; }
  body[data-size="tiny"] .washer { width: 64px; height: 78px; }
  /*
     极简态气泡不占位。但不能直接 display:none —— 那样没有过渡，
     气泡会"啪"地消失。改成高度塌缩 + 透明，结束再真正隐藏。
   */
  body[data-size="tiny"] .bubble {
    opacity: 0;
    max-height: 0;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }
  /* 极简态没有气泡，状态全靠机器自己的指示灯表达，给它加点辉光 */


  /* ---------- 状态灯 ---------- */
  /*
   * 以前浮窗在机器右上角外挂了一颗独立的圆灯。问题是三套造型本来就
   * 各自带着自己的指示灯——像素是机身上的 .px-led、精密家电是面板上的
   * .led、精密家电是液晶屏那道发光条——再挂一颗悬在最外层的灯，
   * 怎么看都是贴在机器身上的异物，而不是机器的一部分。
   *
   * 现在只用造型自带的灯：把状态色注入 --led，由各造型的 CSS 自己消化。
   * 那套皮肤本来就在主界面 dock 里正常工作，浮窗复用同一份样式表，
   * 所以不需要第二套灯光逻辑。
   */
  .machine { position: relative; }
  /* 等待确认和故障要闪，其余状态常亮——闪是"需要人看一眼"的信号 */
  /* 闪烁由各造型自己的 [data-blink] 规则驱动，这里不重复写 */
  body[data-size="tiny"] .dw-px .px-led { filter: drop-shadow(0 0 4px var(--dw-led, #7c8896)); }
  body[data-size="tiny"] .dw-pw .led { filter: drop-shadow(0 0 4px var(--dw-sig-run)); }

  /* ---------- 造型选择 ---------- */
  /* 三套造型由 float.machines.js 生成 DOM 和 CSS，这里只管摆放。
     方案 B：窗口固定宽度，三套造型都缩放到同一宽度，
     所以外层 .machine 的尺寸在三套之间保持一致，切换时不跳。 */
  /*
   * transform-origin 必须是 0 0。
   * 默认锚点在元素中心，scale(0.34) 会把内容往四周收缩的同时把左上角
   * 推到 (70%,70%) 的位置——机器就整个跑到窗口右下角外面去了。
   *
   * 选择器不能写成 .machine > .dw-frame-inner：中间隔着 skinHost 这一层。
   */
  .machine .dw-frame { display: block; position: relative; }
  .machine .dw-frame .dw-frame-inner { transform-origin: 0 0; }
  /* 精密家电造型靠自带的 transition 表达水位，像素图靠 --water */
  body[data-size="tiny"] .machine > .dw-frame { transform-origin: top left; }

  /* ---------- 主题：跟随宿主 GUI（dock 同款明暗） ---------- */
  /*
   * Web 端把宿主 documentElement 是否带 data-ds-dark-theme 量出来，
   * 经 /dsh-washer/prefs 送到主进程，再推给这里，落到 body[data-theme]。
   * - light：白底气泡、深字，机器用亮色材质（--dw-* 默认值本身就是亮色）。
   * - dark ：深底气泡、浅字，机器换成暗色材质（下面这段覆盖 --dw-*）。
   * 机器材质的暗色值直接搬主界面 [data-ds-dark-theme] 那套，保证两边同款。
   */
  body[data-theme="light"] {
    color-scheme: light;
    --bubble: rgba(255, 255, 255, .92);
    --text: #1b2430;
    --dim: #6b7684;
  }
  body[data-theme="light"] .bubble {
    box-shadow: 0 2px 8px rgba(20, 40, 70, .14), 0 0 0 .5px rgba(0, 0, 0, .06);
  }
  body[data-theme="dark"] .washerskin,
  body:not([data-theme="light"]) .washerskin {
    --dw-body-1: #4c5762;
    --dw-body-2: #39434e;
    --dw-body-3: #28313a;
    --dw-body-4: #1b2229;
    --dw-body-edge: rgba(255, 255, 255, 0.16);
    --dw-body-shade: rgba(0, 0, 0, 0.55);
    --dw-chrome-1: #b9c4cf;
    --dw-chrome-2: #6b7885;
    --dw-chrome-3: #3a444f;
    --dw-chrome-4: #8b98a5;
    --dw-glass-1: rgba(120, 180, 215, 0.55);
    --dw-glass-2: rgba(46, 96, 130, 0.6);
    --dw-glass-3: rgba(14, 38, 58, 0.9);
    --dw-glass-4: rgba(4, 12, 20, 0.97);
    --dw-water-1: #6fc3e6;
    --dw-water-2: #2b7ea8;
    --dw-water-3: #17546f;
    --dw-sig-run: #4aa3f0;
    --dw-sig-wait: #f0b73a;
    --dw-sig-err: #f26064;
    --dw-sig-ok: #3fbf7a;
    --dw-sig-off: #4c5762;
  }
  /* ---------- 状态光：整机被状态色"照亮" ---------- */
  /*
   * 视频里每个镜头都有这层光晕，是"远看就知道在忙什么"的关键。
   * 我们的状态色早就有（--led / --dw-sig），但只落在一颗 7px 小灯上。
   *
   * 做法是把同一个颜色加成门圈/机身的外发光，而不是新造一套配色——
   * 一旦两处颜色不同源，迟早会互相打架（主题切换时尤其明显）。
   * glow 半径刻意压小：透明窗口上大半径 box-shadow 是逐像素算的，
   * 半径翻倍功耗大概翻两番，80px 的物件上 12px 已经够看。
   */
  .machine > .skin-host {
    --glow: transparent;
    transition: filter .5s ease;
    filter: drop-shadow(0 0 0 transparent);
  }
  .machine[data-state="starting"] > .skin-host,
  .machine[data-state="washing"] > .skin-host,
  .machine[data-state="rinsing"] > .skin-host,
  .machine[data-state="spinning"] > .skin-host,
  .machine[data-state="draining"] > .skin-host {
    --glow: rgba(58, 160, 255, .55);
    filter: drop-shadow(0 0 7px var(--glow));
  }
  .machine[data-state="waiting"] > .skin-host { filter: drop-shadow(0 0 7px rgba(245, 185, 58, .5)); }
  .machine[data-state="error"] > .skin-host { filter: drop-shadow(0 0 8px rgba(229, 72, 77, .6)); }
  .machine[data-state="done"] > .skin-host { filter: drop-shadow(0 0 6px rgba(46, 224, 106, .45)); }
  /* 待机不要发光，静就得真的静 */
  .machine[data-state="idle"] > .skin-host,
  .machine[data-state="off"] > .skin-host { filter: none; }
  body[data-size="tiny"] .machine > .skin-host { filter: none; }

  /* ---------- 减弱动态 / 不可见时暂停 ---------- */
  /*
   * 减弱动态效果时，门外道具只保留"亮/不亮"的静态信息，不再飘、不再抖。
   * 必须自己写：style.css 里那几条 @media 只覆盖 dock 的 sprite，
   * 浮窗是另一个页面，样式表不通。
   */
  @media (prefers-reduced-motion: reduce) {
    .machine, .machine[data-pop="1"], .props > * { animation: none !important; }
    .machine[data-state="waiting"] .props .p-q,
    .machine[data-state="error"] .props .p-bolt,
    .machine[data-state="done"] .props .p-stars,
    .machine[data-state="idle"] .props .p-glow { opacity: .9; }
  }
  /*
   * 窗口不可见时停掉动画。
   * 透明置顶窗口被完全遮住时 Chromium 不一定停合成器，动画照跑、白烧电。
   * visibilitychange 是这里唯一可靠的信号（见脚本里的监听）。
   */
  html[data-hidden="1"] .machine,
  html[data-hidden="1"] .props > *,
  html[data-hidden="1"] .px-wheel { animation-play-state: paused !important; }

</style>
</head>
<body data-size="normal" data-skin="precision" data-theme="dark">
<div class="wrap" id="wrap" data-conn="idle">
  <div class="machine" id="machine" data-blink="0" data-shake="0"
       style="--water:7;--foam:0;--led:#7c8896;--spin-dur:0s;--spin-play:paused">
    <div class="grab" id="grab"></div>
    <!-- 门外道具层：问号 / 闪电 / 三颗星 / 待机呼吸光，全部由 data-state 驱动 -->
    <div class="props" aria-hidden="true">
      <span class="p-q">?</span>
      <span class="p-bolt">⚡</span>
      <span class="p-stars"><i></i><i></i><i></i></span>
      <span class="p-glow"></span>
    </div>
    <div class="skin-host washerskin" id="skinHost"></div>
  </div>
  <div class="bubble" id="bubble">
    <span class="st" id="st" data-s="off">未连接</span>
    <span class="tm" id="tm">--:--</span>
  </div>
</div>

<script src="./float.machines.js"></script>
<script>
(function () {
  var LABEL = {
    off: '未连接', idle: '待机', starting: '启动中', washing: '洗涤中',
    rinsing: '漂洗中', spinning: '脱水中', waiting: '等你确认',
    draining: '排水换水', done: '洗完了', error: '故障',
  };
  // 和 src/core.js 的 VISUAL 一一对应；这里只保留悬浮窗用得到的四个量
  var VISUAL = {"off":{"water":7,"foam":0,"led":"#4a5560","blink":0,"spin":0},"idle":{"water":6.5,"foam":0,"led":"#7c8896","blink":0,"spin":0},"starting":{"water":3.5,"foam":0.3,"led":"#3aa0ff","blink":0,"spin":5},"washing":{"water":0.5,"foam":1,"led":"#3aa0ff","blink":0,"spin":2.4},"rinsing":{"water":0.5,"foam":0.6,"led":"#3aa0ff","blink":0,"spin":2.4},"spinning":{"water":4,"foam":0,"led":"#3aa0ff","blink":0,"spin":0.6},"waiting":{"water":4.5,"foam":0.2,"led":"#f5b93a","blink":0.6,"spin":0},"draining":{"water":7,"foam":0,"led":"#1f9aa8","blink":0,"spin":5},"done":{"water":6.5,"foam":0,"led":"#2ee06a","blink":0,"spin":0},"error":{"water":5,"foam":0,"led":"#e5484d","blink":0.35,"spin":0}};

  var el = function (id) { return document.getElementById(id); };
  var host = window.washerHost || null;
  var machine = el('machine');

  function setConn(kind) {
    el('wrap').dataset.conn = kind;
  }

  /*
   * 当前造型与上次渲染的状态。机械造型重建有成本（精密家电有几十个节点），
   * 所以只在造型或状态真的变了才重建——每秒一次的计时刷新不该重画整台机器。
   */
  var curSkin = 'precision';
  var curState = null;

  /**
   * 状态灯：浮窗自己的，不是像素图里那个。
   *
   * 像素图里的 LED 是 10×10 的像素细节，缩放到 112px 宽后只有十来个屏幕像素，
   * 红蓝绿在上面根本分不出来。浮窗要承担"状态播报"的职责，所以单独给一个
   * 够大、带光晕的圆点——这不是重复，是把信息从细节里解放出来。
   */
  /*
   * 状态色写进机器容器，由造型自己的灯去消化（见上面「状态灯」那段注释）。
   * 以前这里操作的是外挂的 .lamp 元素，那颗灯已经删了。
   */
  function paintLamp(s) {
    var machine = el('machine');
    if (machine === null) return;
    var v = VISUAL[s] || VISUAL.idle;
    machine.style.setProperty('--led', v.led);
  }

  function buildMachine(snap) {
    var s = snap.state || 'off';
    if (s === curState && el('skinHost').firstChild !== null) return;
    curState = s;
    var hostNode = el('skinHost');
    var width = 112;
    // 极简态机器小一圈，保持窗口比例
    if (document.body.dataset.size === 'tiny') width = 64;
    hostNode.textContent = '';
    // --dw-* 变量挂在 .washerskin 上，[data-state] 的状态色绑定也靠这个容器，
    // 忘了同步就会用上一轮的状态配色（灯红了机器还蓝着）
    hostNode.setAttribute('data-state', s);
    if (window.WasherMachines) {
      hostNode.appendChild(window.WasherMachines.build(
        curSkin, s, width, snap.durationText || '--:--', snap.state === 'waiting'));
    }
    curState = s;
  }

  function render(snap) {
    var s = snap.state || 'off';
    var v = VISUAL[s] || VISUAL.idle;
    var prev = machine.dataset.state;

    /*
     * 故障时别再只写「故障」二字——用户看不到主界面的详情面板，
     * 光一个红灯加两个字，什么也判断不了。快照里的 errorCode 是
     * Host 端从 turn/end 的 reason 里翻译出来的（E-10 账号、E-30 上下文、
     * E-40 中断……），拼在状态文字后面，一眼就知道该干嘛。
     */
    var errCode = s === 'error' && snap.errorCode ? snap.errorCode : '';
    el('st').textContent = (LABEL[s] || s) + (errCode ? ' · ' + errCode : '');
    el('st').dataset.s = s;
    el('tm').textContent = snap.durationText || '--:--';

    paintLamp(s);
    buildMachine(snap);

    machine.style.setProperty('--water', String(v.water));
    machine.style.setProperty('--foam', String(v.foam));
    machine.style.setProperty('--led', String(v.led));
    // spin 是"每秒转多少圈"，换算成动画时长；0 就暂停在静止档
    var spinDur = v.spin > 0 ? (1 / v.spin).toFixed(2) + 's' : '0s';
    machine.style.setProperty('--spin-dur', spinDur);
    machine.style.setProperty('--spin-play', v.spin > 0 ? 'running' : 'paused');

    // 甩干抖得最厉害，洗涤时轻微抖——这是"在干活"的体感
    machine.dataset.shake = s === 'spinning' ? '2' : (s === 'washing' || s === 'draining' ? '1' : '0');
    machine.dataset.blink = v.blink > 0 ? (v.blink < 0.5 ? '2' : '1') : '0';

    // 状态落到 .machine 上，门外道具层靠它选表情（问号/闪电/星星/呼吸光）
    machine.dataset.state = s;

    /*
     * 切状态的"预备动作"。
     * 静态切换在任何屏幕上都会显得假——真实的东西动之前会先蓄一下。
     * 这里只在"真的换了状态"时打一次 one-shot 动画，避免每帧重放。
     * 重启 CSS 动画必须先删属性再强制 reflow，同一帧里连着设不会重播。
     */
    if (prev !== undefined && prev !== s && s !== 'off') {
      delete machine.dataset.pop;
      void machine.offsetWidth;
      machine.dataset.pop = '1';
      setTimeout(function () {
        delete machine.dataset.pop;
      }, 260);
    }
  }

  /*
   * 穿透的开关全在页面之外：设置页的「鼠标穿透」开关，以及 ⌥⌘W 全局快捷键。
   * 浮窗自己不再提供任何切换入口——右下角那颗亮蓝按钮已经删掉了，
   * 它是穿在机器身上的一块异物，而且穿透态本来就有整机半透明在提示。
   */
  if (host) {
    host.onClickThroughChange(function (on) {
      document.body.dataset.through = on ? '1' : '0';
    });
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      host.showMenu();
    });

  }

  /* 断线重连：宿主重启后端口和 token 都会变，所以每次都重新问主进程 */
  var retry = 0;
  function connect(port, token) {
    var ws;
    try { ws = new WebSocket('ws://127.0.0.1:' + port + '/dsh-washer/stream?token=' + encodeURIComponent(token)); }
    catch (e) { setConn('lost'); return; }
    ws.onopen = function () { setConn('open'); retry = 0; };
    ws.onmessage = function (ev) {
      try { lastSnap = JSON.parse(ev.data); render(lastSnap); } catch (e) { /* 脏帧忽略 */ }
    };
    ws.onclose = function () {
      setConn('lost');
      retry = Math.min(retry + 1, 5);
      setTimeout(reconnect, 500 * Math.pow(2, retry - 1));
    };
    ws.onerror = function () { setConn('lost'); };
  }
  function reconnect() {
    if (!host) return;
    host.state().then(function (st) {
      if (st && st.endpoint) connect(st.endpoint.port, st.endpoint.token);
      else setTimeout(reconnect, 2000);
    });
  }
  /* 尺寸档位与皮肤：主进程是唯一信源（它要按档位改窗口大小），
     页面只负责照着渲染。初始值从 state() 拿，之后靠 onPrefs 推送。 */
  var lastSnap = null;

  function applyPrefs(p) {
    if (p === null || typeof p !== 'object') return;
    var skinChanged = false;
    if (typeof p.size === 'string' && document.body.dataset.size !== p.size) {
      document.body.dataset.size = p.size;
      // 档位变了机器宽度也变，必须重建
      skinChanged = true;
    }
    if (typeof p.skin === 'string' && p.skin !== curSkin) {
      curSkin = p.skin;
      document.body.dataset.skin = p.skin;
      skinChanged = true;
    }
    // 主题：Web 端推来的明暗，落到 body[data-theme]，CSS 据此切浅/深。
    // 机器材质走 CSS 变量，不需要重建；换皮肤才要重建。
    if (typeof p.dark === 'boolean') {
      var nextTheme = p.dark ? 'dark' : 'light';
      if (document.body.dataset.theme !== nextTheme) {
        document.body.dataset.theme = nextTheme;
      }
    }
    if (skinChanged) {
      curState = null;
      if (lastSnap !== null) { buildMachine(lastSnap); paintLamp(lastSnap.state || 'off'); }
    }
    /*
     * 这里原本有一行 reportCorner()——「可点的洞」那套做法删掉之后，
     * 主进程的 setCornerRect / preload 里的桥一起没了，只剩这个调用点。
     * 结果是每次切档位/皮肤都抛 ReferenceError，把 applyPrefs 后半段全部
     * 吞掉（现在它正好是最后一行所以看不出来，但之后再往下加逻辑就会静默失效）。
     * 窗口尺寸由主进程自己 setSize 管，页面不需要上报任何矩形。
     */
  }
  /*
   * 不可见就停动画（见样式表 html[data-hidden] 那段）。
   * 浮窗是常驻进程，切到别的 Space、被全屏应用盖住时都收不到别的信号，
   * 只有 visibilitychange 会告诉我们"现在没人看"。
   */
  function syncHidden() {
    document.documentElement.dataset.hidden = document.hidden ? '1' : '0';
  }
  document.addEventListener('visibilitychange', syncHidden);
  syncHidden();

  if (host) {
    host.state().then(function (st) {
      if (st) applyPrefs({ size: st.size, skin: st.skin, dark: st.dark });
    });
    host.onPrefs(applyPrefs);

    /*
     * 把系统的"减弱动态效果"告诉主进程。
     * 窗口尺寸的插值动画跑在主进程里，它读不到 CSS 媒体查询，
     * 只能由这边量一次再送过去，否则开了无障碍偏好还是会看到窗口缩放。
     */
    if (typeof host.setReduceMotion === 'function' && window.matchMedia) {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      host.setReduceMotion(mq.matches);
      mq.addEventListener('change', function (e) { host.setReduceMotion(e.matches); });
    }
  }

  if (host) reconnect();
})();
</script>
</body>
</html>
